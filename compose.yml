services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: effect_erp
      POSTGRES_USER: effect_migrator
      POSTGRES_PASSWORD: effect-migrator-development
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U effect_migrator -d effect_erp"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-runtime-role.sql:/docker-entrypoint-initdb.d/10-runtime-role.sql:ro

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/migrate.js"]
    environment:
      DATABASE_MIGRATION_URL: postgres://effect_migrator:effect-migrator-development@postgres:5432/effect_erp
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      API_PORT: 3001
      DATABASE_URL: postgres://effect:effect@postgres:5432/effect_erp
      WEB_ORIGIN: http://localhost:3000
      INTERNAL_API_URL: http://api:3001
      OTP_PEPPER: development-otp-pepper-must-be-32-chars
      JWT_ACCESS_SECRET: development-jwt-secret-must-be-32-chars
      SMS_PROVIDER: console
      OTP_DELIVERY_ACTIVATION_MARGIN_SECONDS: 5
      INITIAL_ADMIN_PHONE: "09121234567"
      COOKIE_SECURE: "false"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:3001/api/v1/health/ready >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "3001:3001"

  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/seed.js"]
    environment:
      DATABASE_URL: postgres://effect:effect@postgres:5432/effect_erp
      INITIAL_ADMIN_PHONE: "09121234567"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        INTERNAL_API_URL: http://api:3001
    environment:
      INTERNAL_API_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "3000:3000"

volumes:
  postgres_data:
