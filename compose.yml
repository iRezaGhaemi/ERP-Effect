services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: effect_erp
      POSTGRES_USER: effect_migrator
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?set POSTGRES_MIGRATOR_PASSWORD}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?set POSTGRES_RUNTIME_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U effect_migrator -d effect_erp"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-runtime-role.sh:/docker-entrypoint-initdb.d/10-runtime-role.sh:ro

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/migrate.js"]
    environment:
      DATABASE_MIGRATION_URL: postgres://effect_migrator:${POSTGRES_MIGRATOR_PASSWORD:?set POSTGRES_MIGRATOR_PASSWORD}@postgres:5432/effect_erp
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      API_PORT: 3001
      DATABASE_URL: postgres://effect:${POSTGRES_RUNTIME_PASSWORD:?set POSTGRES_RUNTIME_PASSWORD}@postgres:5432/effect_erp
      WEB_ORIGIN: http://localhost:3000
      INTERNAL_API_URL: http://api:3001
      AUTH_RATE_LIMIT_SECRET: ${AUTH_RATE_LIMIT_SECRET:?set AUTH_RATE_LIMIT_SECRET}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      COOKIE_SECURE: "false"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3001/api/v1/health/ready >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:3001:3001"
    read_only: true
    tmpfs: [/tmp]

  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/seed.js"]
    environment:
      DATABASE_URL: postgres://effect:${POSTGRES_RUNTIME_PASSWORD:?set POSTGRES_RUNTIME_PASSWORD}@postgres:5432/effect_erp
      INITIAL_ADMIN_PHONE: ${INITIAL_ADMIN_PHONE:?set INITIAL_ADMIN_PHONE}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:?set INITIAL_ADMIN_USERNAME}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?set INITIAL_ADMIN_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        INTERNAL_API_URL: http://api:3001
    environment:
      INTERNAL_API_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs: [/tmp]

volumes:
  postgres_data:
