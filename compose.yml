services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: effect_erp
      POSTGRES_USER: effect
      POSTGRES_PASSWORD: effect
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U effect -d effect_erp']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      API_PORT: 3001
      DATABASE_URL: postgres://effect:effect@postgres:5432/effect_erp
      WEB_ORIGIN: http://localhost:3000
      INTERNAL_API_URL: http://api:3001
      OTP_PEPPER: development-otp-pepper-must-be-32-chars
      JWT_ACCESS_SECRET: development-jwt-secret-must-be-32-chars
      SMS_PROVIDER: console
      INITIAL_ADMIN_PHONE: '09121234567'
      COOKIE_SECURE: 'false'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/api/v1/health/ready >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '3001:3001'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        INTERNAL_API_URL: http://api:3001
    environment:
      INTERNAL_API_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000 >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '3000:3000'

volumes:
  postgres_data:
