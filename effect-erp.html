/* ============================================================
   EFFECT ERP — Design System · LIGHT-first · RTL · Persian
   Primary brand: #6F6AEB
   ============================================================ */
:root{
  /* surfaces — light */
  --bg:#f6f6f8; --s1:#ffffff; --s2:#f4f4f6; --s3:#f0f0f3; --s4:#e9e9ee;
  --bd:#e7e7eb; --bd2:#d8d8df;
  /* text */
  --t1:#211f26; --t2:#585763; --t3:#8b8a95;
  /* brand — #6F6AEB system */
  --pr:#6f6aeb; --pr2:#5853e0; --pr3:#6f6aeb; --pr-soft:rgba(111,106,235,.07); --pr-soft2:rgba(111,106,235,.14);
  /* semantic — restrained */
  --ok:#0f7a55; --ok-soft:rgba(15,122,85,.1);
  --warn:#9a6207; --warn-soft:rgba(154,98,7,.1);
  --err:#c22532; --err-soft:rgba(194,37,50,.09);
  --info:#1d6fd0; --info-soft:rgba(29,111,208,.09);
  /* misc */
  --r-lg:12px; --r-md:10px; --r-sm:8px;
  --sh-1:none;
  --sh-2:none;
  --sh-3:none;
  --f:'IRANSansX','Estedad',ui-sans-serif,system-ui,'Segoe UI',Tahoma,sans-serif;
  --tr:180ms cubic-bezier(.4,0,.2,1);
}
[data-theme=dark]{
  --bg:#171717; --s1:#202020; --s2:#262626; --s3:#2a2a2a; --s4:#303030;
  --bd:#353535; --bd2:#404040;
  --t1:#f5f5f5; --t2:#a3a3a3; --t3:#737373;
  --pr:#6f6aeb; --pr2:#8b86f2; --pr3:#b9b5f6; --pr-soft:rgba(139,134,242,.14); --pr-soft2:rgba(139,134,242,.24);
  --ok:#4cc38a; --ok-soft:rgba(76,195,138,.13);
  --warn:#e0a33c; --warn-soft:rgba(224,163,60,.13);
  --err:#e5484d; --err-soft:rgba(229,72,77,.13);
  --info:#5ca8f5; --info-soft:rgba(92,168,245,.13);
  --sh-1:none;
  --sh-2:none;
  --sh-3:none;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{
  margin:0;font-family:var(--f);background:var(--bg);color:var(--t1);
  font-size:14px;line-height:1.7;direction:rtl;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
h1,h2,h3,h4,h5,p{margin:0}
b,strong{font-weight:600}
a{color:var(--pr3);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit}
input,select,textarea{font-family:inherit}
::selection{background:rgba(111,106,235,.22);color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--bd2)}
::-webkit-scrollbar-track{background:transparent}
:focus{outline:none}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px;border-radius:6px}
svg{display:inline-block;vertical-align:middle;flex:none}

/* ---------- typography scale ---------- */
.t-display{font-size:30px;line-height:1.5;font-weight:600;letter-spacing:0}
.t-h1{font-size:23px;line-height:1.55;font-weight:600}
.t-h2{font-size:19px;line-height:1.6;font-weight:600}
.t-h3{font-size:16px;line-height:1.65;font-weight:600}
.t-h4{font-size:14px;line-height:1.7;font-weight:500}
.t-bl{font-size:16px;line-height:1.85;color:var(--t1)}
.t-b{font-size:14px;line-height:1.7;color:var(--t1)}
.t-bs{font-size:13px;line-height:1.7;color:var(--t2)}
.t-cap{font-size:12px;line-height:1.6;color:var(--t3)}
.t-lbl{font-size:12px;line-height:1.5;color:var(--t2);font-weight:500}
.num{font-variant-numeric:tabular-nums;letter-spacing:0}

/* ---------- layout utils ---------- */
.row{display:flex;align-items:center;gap:12px}
.row.b{align-items:flex-start}
.col{display:flex;flex-direction:column;gap:0}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.g4{gap:4px}.g6{gap:8px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}.g20{gap:24px}.g24{gap:24px}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:24px}.mt24{margin-top:24px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:24px}
.mr-auto{margin-right:auto}.ml-auto{margin-left:auto}
.tc{text-align:center}.ts{font-size:12px;color:var(--t3)}
.t2c{color:var(--t2)}.t3c{color:var(--t3)}.prc{color:var(--pr3)}
.hide{display:none!important}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-6{grid-template-columns:repeat(6,1fr)}
.divider{height:1px;background:var(--bd);border:0;margin:0}

/* ---------- surfaces ---------- */
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r-lg);position:relative}
.card-h{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--bd)}
.card-h .t-h3{flex:1}
.card-b{padding:16px}
.card-f{padding:10px 16px;border-top:1px solid var(--bd);display:flex;align-items:center;gap:8px}
.panel{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r-md)}
.hoverable:hover{border-color:var(--bd2);background:var(--s2)}

/* ---------- page scaffold ---------- */
.pg{flex:1;min-width:0;display:flex;flex-direction:column;padding:24px 24px 48px;max-width:1460px;width:100%;margin:0 auto}
.pg-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.pg-head .grow{min-width:220px}
.crumb{display:flex;align-items:center;gap:8px;color:var(--t3);font-size:12px;margin-bottom:4px}
.crumb a{color:var(--t3)}
.crumb a:hover{color:var(--pr3)}
.crumb .sep{opacity:.6}
.pg-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sec-title{display:flex;align-items:center;gap:8px;margin:24px 0 12px;font-size:15px;font-weight:600}
.sec-title .ln{flex:1;height:1px;background:var(--bd)}

/* ---------- badges / chips / tags ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:500;line-height:1.9;white-space:nowrap;border:1px solid transparent}
.bd-mut{background:var(--s3);color:var(--t2);border-color:var(--bd)}
.bd-ok{background:var(--ok-soft);color:var(--ok)}
.bd-warn{background:var(--warn-soft);color:var(--warn)}
.bd-err{background:var(--err-soft);color:var(--err)}
.bd-info{background:var(--info-soft);color:var(--info)}
.bd-pr{background:var(--pr-soft);color:var(--pr3)}
.badge .dot{width:5px;height:5px;border-radius:99px;background:currentColor}
.chip{display:inline-flex;align-items:center;gap:8px;padding:3px 12px;border-radius:99px;font-size:12px;font-weight:500;background:var(--s3);border:1px solid var(--bd);color:var(--t2);cursor:default;line-height:1.8}
button.chip,.clickable.chip{cursor:pointer}
button.chip:hover,.chip-sel.on{background:var(--pr-soft);border-color:var(--pr2);color:var(--pr3)}
.tag{display:inline-flex;align-items:center;padding:1px 8px;border-radius:6px;font-size:11px;font-weight:500;background:var(--s3);color:var(--t2);border:1px solid var(--bd);line-height:1.9;white-space:nowrap}
.tag.pr{background:var(--pr-soft);color:var(--pr3);border-color:transparent}

/* ---------- avatars ---------- */
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:99px;font-weight:500;color:#fff;flex:none;position:relative;user-select:none;font-size:12px;width:30px;height:30px}
.av.xs{width:22px;height:22px;font-size:10px}
.av.sm{width:26px;height:26px;font-size:11px}
.av.lg{width:40px;height:40px;font-size:14px}
.av.xl{width:56px;height:56px;font-size:19px}
.av-stack{display:inline-flex;direction:ltr}
.av-stack .av{margin-left:-8px;border:2px solid var(--s1)}
.av-stack .av:last-child{margin-left:0}
.av .st{position:absolute;bottom:-1px;left:-1px;width:9px;height:9px;border-radius:99px;border:2px solid var(--s1)}
.st.ok{background:var(--ok)}.st.off{background:var(--t3)}.st.leave{background:var(--warn)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;height:36px;border-radius:var(--r-md);font-size:13.5px;font-weight:500;border:1px solid transparent;background:var(--s3);color:var(--t1);cursor:pointer;transition:background var(--tr),border-color var(--tr),color var(--tr),opacity var(--tr),transform var(--tr);white-space:nowrap;user-select:none}
.btn:hover{background:var(--s4);border-color:var(--bd2)}
.btn:active{transform:translateY(1px)}
.btn:disabled,.btn.dis{opacity:.45;pointer-events:none}
.btn-pr{background:var(--pr);color:#fff}
.btn-pr:hover{background:var(--pr2);border-color:transparent}
[data-theme=light] .btn-pr{background:var(--pr);color:#fff}
.btn-sec{background:var(--s2);border-color:var(--bd);color:var(--t1)}
.btn-sec:hover{background:var(--s3);border-color:var(--bd2)}
.btn-ghost{background:transparent;color:var(--t2)}
.btn-ghost:hover{background:var(--s2);color:var(--t1)}
.btn-err{background:transparent;color:var(--err);border-color:transparent}
.btn-err:hover{background:var(--err-soft);border-color:var(--err)}
.btn-ok{background:var(--ok-soft);color:var(--ok)}
.btn-ok:hover{background:var(--ok);color:#fff}
.btn-sm{height:30px;padding:0 12px;font-size:12.5px;border-radius:var(--r-sm)}
.btn-lg{height:42px;padding:0 24px;font-size:14.5px}
.btn-blk{width:100%}
.btn .spin{width:14px;height:14px;border-radius:99px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}
.btn-sec .spin,.btn-ghost .spin{border-color:var(--bd);border-top-color:var(--t1)}
@keyframes spin{to{transform:rotate(360deg)}}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:var(--r-sm);border:1px solid transparent;background:transparent;color:var(--t2);cursor:pointer;transition:all var(--tr);flex:none}
.ibtn:hover{background:var(--s3);color:var(--t1)}
.ibtn.on{background:var(--pr-soft);color:var(--pr3)}
.ibtn-err:hover{background:var(--err-soft);color:var(--err)}

/* ---------- form controls ---------- */
.fld{display:flex;flex-direction:column;gap:8px;min-width:0}
.lbl{font-size:12.5px;font-weight:500;color:var(--t2)}
.lbl .req{color:var(--err)}
.hint{font-size:11.5px;color:var(--t3)}
.ferr{font-size:11.5px;color:var(--err);display:flex;align-items:center;gap:4px}
.inp,.sel,.txa{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r-md);color:var(--t1);padding:0 12px;height:38px;font-size:13.5px;transition:border-color var(--tr),background var(--tr),box-shadow var(--tr)}
.txa{height:auto;padding:12px 12px;resize:vertical;min-height:84px;line-height:1.8}
.inp::placeholder,.txa::placeholder{color:var(--t3)}
.inp:hover,.sel:hover,.txa:hover{border-color:var(--bd2)}
.inp:focus,.sel:focus,.txa:focus{border-color:var(--pr);outline:2px solid var(--pr-soft2);outline-offset:-1px}
.inp.err,.sel.err{border-color:var(--err);outline:2px solid var(--err-soft)}
.inp:disabled{opacity:.5;background:var(--s1)}
.inp-ic{position:relative}
.inp-ic .inp{padding-left:32px}
.inp-ic>svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--t3);pointer-events:none}
.sel{appearance:none;-webkit-appearance:none;padding-left:32px;cursor:pointer;background-image:none}
.sel-wrap{position:relative}
.sel-wrap>svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--t3);pointer-events:none}
.frow{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.frow3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

/* checkbox / radio / switch */
.ckb{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-size:13px;color:var(--t1);position:relative}
.ckb input,.rad input{position:absolute;opacity:0;width:0;height:0}
.ckb .bx{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--bd2);background:var(--s2);display:inline-flex;align-items:center;justify-content:center;transition:all var(--tr);flex:none}
.ckb .bx svg{opacity:0;transform:scale(.5);transition:all var(--tr);color:#fff}
.ckb input:checked+.bx{background:var(--pr);border-color:var(--pr)}
.ckb input:checked+.bx svg{opacity:1;transform:scale(1)}
.ckb input:disabled+.bx{opacity:.4}
.ckb input:focus-visible+.bx{outline:2px solid var(--pr);outline-offset:2px}
.ckb.done{color:var(--t3)}
.ckb.done span.txt{text-decoration:line-through}
.rad{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.rad .bx{width:17px;height:17px;border-radius:99px;border:1.5px solid var(--bd2);background:var(--s2);display:inline-flex;align-items:center;justify-content:center;transition:all var(--tr);flex:none}
.rad .bx::after{content:"";width:7px;height:7px;border-radius:99px;background:#fff;transform:scale(0);transition:all var(--tr)}
.rad input:checked+.bx{border-color:var(--pr);background:var(--pr)}
.rad input:checked+.bx::after{transform:scale(1)}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-size:13px}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw .tr{width:34px;height:20px;border-radius:99px;background:var(--s4);border:1px solid var(--bd2);position:relative;transition:all var(--tr);flex:none}
.sw .tr::after{content:"";position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:99px;background:var(--t2);transition:all var(--tr)}
.sw input:checked+.tr{background:var(--pr);border-color:var(--pr)}
.sw input:checked+.tr::after{background:#fff;transform:translateX(-14px)}
.sw input:focus-visible+.tr{outline:2px solid var(--pr);outline-offset:2px}

/* ---------- tabs ---------- */
.tabs{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--bd);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 16px;font-size:13.5px;font-weight:600;color:var(--t2);cursor:pointer;border:0;background:transparent;position:relative;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color var(--tr)}
.tab:hover{color:var(--t1)}
.tab.on{color:var(--pr3);border-bottom-color:var(--pr)}
.tab .cnt{font-size:11px;background:var(--s3);color:var(--t3);border-radius:99px;padding:0 8px;margin-right:4px}
.tab.on .cnt{background:var(--pr-soft);color:var(--pr3)}
.seg{display:inline-flex;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r-md);padding:2px;gap:2px}
.seg button{border:0;background:transparent;color:var(--t2);font-size:12.5px;font-weight:600;padding:4px 12px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all var(--tr)}
.seg button:hover{color:var(--t1)}
.seg button.on{background:var(--s4);color:var(--t1);box-shadow:none;}
.seg button.on svg{color:var(--pr3)}

/* ---------- progress ---------- */
.prog{height:6px;background:var(--s4);border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;border-radius:99px;background:var(--pr);transition:width .4s ease}
.prog.ok>i{background:var(--ok)}
.prog.warn>i{background:var(--warn)}
.prog.err>i{background:var(--err)}
.meter{display:flex;gap:3px;align-items:flex-end;height:26px}
.meter i{width:5px;border-radius:2px;background:var(--bd2);display:block}
.meter i.f{background:var(--pr)}

/* ---------- kbd / tooltip ---------- */
kbd{font-family:inherit;font-size:11px;background:var(--s3);border:1px solid var(--bd2);border-bottom-width:2px;border-radius:5px;padding:1px 8px;color:var(--t2);line-height:1.7}
[data-tip]{position:relative}
[data-tip]::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);right:50%;transform:translateX(50%) scale(.94);background:#0f0f0f;color:#efefef;border:1px solid var(--bd2);padding:4px 12px;border-radius:7px;font-size:11.5px;white-space:nowrap;opacity:0;pointer-events:none;transition:all 120ms;z-index:90;box-shadow:none;}
[data-theme=light] [data-tip]::after{background:#26262b;border-color:#3a3a41;color:#f5f5f5}
[data-tip]:hover::after{opacity:1;transform:translateX(50%) scale(1)}

/* ---------- tables ---------- */
.tbl-wrap{border:1px solid var(--bd);border-radius:var(--r-lg);background:var(--s1);overflow:hidden}
.tbl-scroll{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
.tbl th{text-align:right;font-size:11.5px;font-weight:600;color:var(--t3);padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--s2);white-space:nowrap;user-select:none}
.tbl th.srt{cursor:pointer}
.tbl th.srt:hover{color:var(--t1)}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--bd);vertical-align:middle;color:var(--t1)}
.tbl tbody tr{transition:background var(--tr)}
.tbl tbody tr:hover{background:var(--s2)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tr.clk{cursor:pointer}
.tbl .sub{font-size:11.5px;color:var(--t3);margin-top:2px}
.tbl td.num,.tbl th.num{text-align:left;direction:ltr}
.row-sel{background:var(--pr-soft)!important}
.tbl-empty{padding:40px;text-align:center}

/* ---------- states ---------- */
.skel{background:var(--s2);animation:skPulse 1.4s ease infinite;border-radius:var(--r-md)}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px;gap:8px}
.state .ic{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--s2);border:1px solid var(--bd);color:var(--t3);margin-bottom:12px}
.state .ic.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.state .ic.err{background:var(--err-soft);color:var(--err);border-color:transparent}
.state h4{font-size:14.5px;font-weight:600}
.state p{font-size:12.5px;color:var(--t3);max-width:340px}
.state .row{margin-top:12px}

/* ---------- misc ---------- */
.stat-dot{width:8px;height:8px;border-radius:99px;flex:none}
.kpi{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r-lg);padding:12px 16px;display:flex;flex-direction:column;gap:4px;min-width:0;transition:border-color var(--tr)}
.kpi:hover{border-color:var(--bd2)}
.kpi .k-l{font-size:12.5px;color:var(--t2);font-weight:600;display:flex;align-items:center;gap:8px}
.kpi .k-l svg{color:var(--t3)}
.kpi .k-v{font-size:21px;font-weight:600;letter-spacing:0;min-width:0;display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 4px;overflow-wrap:anywhere}
.kpi .k-v .un{font-size:12px;color:var(--t3);font-weight:600;margin-right:4px}
.kpi .k-d{font-size:11.5px;display:flex;align-items:center;gap:4px;font-weight:600}
.kpi .k-d.up{color:var(--ok)}.kpi .k-d.dn{color:var(--err)}
.kpi.accent{border-color:var(--pr2);background:var(--pr-soft)}
.empty-mini{padding:24px 16px;text-align:center;color:var(--t3);font-size:12.5px;border:1px dashed var(--bd2);border-radius:var(--r-md)}
.load-more{padding:8px 0}
.fade-in{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- containment guards (nothing may escape its box) ---------- */
img,svg{max-width:100%}
.badge,.chip,.tag,.due{max-width:100%}
.badge{overflow:hidden;text-overflow:ellipsis}
.due{overflow:hidden}
.btn{max-width:100%}
.card,.panel,.kpi{overflow-wrap:break-word}
.tbl td,.tbl th{overflow-wrap:break-word}
.row,.col{min-width:0}
.ellip{min-width:0}
.key-mask .k{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.cmd-i{max-width:100%}
.cmd-i span:first-of-type{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd-i .sub{max-width:40%;overflow:hidden;text-overflow:ellipsis}
.card-f,.drawer-f,.m-f,.pg-actions,.cal-h,.filterbar,.kb-h,.appr,.todo,.feed{flex-wrap:wrap}
.menu{max-width:calc(100vw - 16px)}
.msnc{min-width:0}
.msn{min-width:0}
.msn b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@keyframes skPulse{0%,100%{opacity:1}50%{opacity:.55}}
/* ============================================================
   APPLICATION SHELL — sidebar (right, RTL) · topbar · overlays
   ============================================================ */
#app{min-height:100vh}
.auth-bg{height:100vh;display:grid;grid-template-columns:1fr 1fr;position:relative;background:var(--bg);overflow:hidden}
.auth-art{position:relative;min-height:0;overflow:hidden}
.auth-art img{width:100%;height:100%;object-fit:cover;display:block}
.auth-art::after{content:"";position:absolute;inset:0;background:rgba(111,106,235,.16);pointer-events:none}
.auth-side{display:flex;padding:40px 24px;min-height:0;overflow-y:auto}
.auth-side .auth-card{margin:auto}


.auth-card{width:100%;max-width:420px;background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:32px;position:relative;z-index:1;box-shadow:none;animation:authIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes authIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.auth-brand{display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:24px;text-align:center}
.logo-mark{width:52px;height:52px;border-radius:15px;background:var(--pr);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:none;}
.logo-mark.sm{width:30px;height:30px;border-radius:9px;box-shadow:none;}
.logo-mark.lg{width:64px;height:64px;border-radius:18px}

/* ---------- shell frame ---------- */
.shell{display:flex;min-height:100vh;flex-direction:row;background:var(--bg)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}

/* sidebar */
.sb{width:250px;flex:none;background:var(--s1);border-left:1px solid var(--bd);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:width .22s cubic-bezier(.4,0,.2,1);z-index:40}
.sb-brand{display:flex;align-items:center;gap:12px;padding:16px 16px 16px;flex:none}
.sb-brand .nm{font-size:15.5px;font-weight:600;letter-spacing:0;white-space:nowrap}
.sb-brand .nm small{display:block;font-size:10px;color:var(--t3);font-weight:600;letter-spacing:.5px}
.sb-collapse{margin-right:auto}
.sb-ws{margin:2px 12px 12px;flex:none}
.sb-ws-btn{display:flex;align-items:center;gap:12px;width:100%;padding:8px 8px;border-radius:var(--r-md);border:1px solid var(--bd);background:var(--s2);cursor:pointer;transition:all var(--tr);color:var(--t1);text-align:right}
.sb-ws-btn:hover{border-color:var(--bd2);background:var(--s3)}
.ws-tile{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex:none}
.sb-ws-btn .nm{flex:1;min-width:0}
.sb-ws-btn .nm b{display:block;font-size:12.5px;font-weight:500;line-height:1.5}
.sb-ws-btn .nm span{display:block;font-size:10.5px;color:var(--t3);line-height:1.5}
.sb-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 12px 12px;display:flex;flex-direction:column;gap:2px}
.sb-sec{font-size:10.5px;font-weight:600;color:var(--t3);padding:16px 8px 4px;letter-spacing:.3px}
.sb-item{display:flex;align-items:center;gap:12px;width:100%;padding:8px 8px;border-radius:var(--r-md);color:var(--t2);font-size:13px;font-weight:500;border:0;background:transparent;cursor:pointer;transition:all var(--tr);position:relative;text-align:right;white-space:nowrap}
.sb-item svg{color:var(--t3);transition:color var(--tr)}
.sb-item:hover{background:var(--s2);color:var(--t1)}
.sb-item:hover svg{color:var(--t2)}
.sb-item.on{background:var(--pr-soft);color:var(--pr3)}
.sb-item.on svg{color:var(--pr3)}
.sb-item.on::before{content:"";position:absolute;right:-12px;top:7px;bottom:7px;width:3px;border-radius:3px 0 0 3px;background:var(--pr)}
.sb-item .n-badge{margin-right:auto;background:var(--err);color:#fff;font-size:10px;font-weight:500;border-radius:99px;min-width:17px;height:17px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px}
.sb-item .p-dot{margin-right:auto;width:6px;height:6px;border-radius:99px;background:var(--pr3);box-shadow:none;}
.sb-item .chev{margin-right:auto;transition:transform var(--tr);color:var(--t3)}
.sb-grp.open .sb-item .chev{transform:rotate(180deg)}
.sb-sub{display:none;flex-direction:column;gap:1px;padding:2px 16px 4px 8px;margin-top:1px}
.sb-grp.open .sb-sub{display:flex}
.sb-sub button{display:flex;align-items:center;gap:8px;padding:4px 8px;border:0;background:transparent;color:var(--t2);font-size:12.5px;font-weight:600;border-radius:8px;cursor:pointer;text-align:right;transition:all var(--tr)}
.sb-sub button::before{content:"";width:4px;height:4px;border-radius:99px;background:var(--bd2);flex:none;transition:all var(--tr)}
.sb-sub button:hover{color:var(--t1);background:var(--s2)}
.sb-sub button.on{color:var(--pr3)}
.sb-sub button.on::before{background:var(--pr3)}
.sb-sub button .cnt{margin-right:auto;font-size:10.5px;color:var(--t3)}
.sb-user{flex:none;border-top:1px solid var(--bd);padding:12px 12px;display:flex;align-items:center;gap:12px}
.sb-user .nm{flex:1;min-width:0}
.sb-user .nm b{display:block;font-size:12.5px;font-weight:500;line-height:1.5}
.sb-user .nm span{display:block;font-size:10.5px;color:var(--t3);line-height:1.5}

/* collapsed */
.sb.mini{width:70px}
.sb.mini .sb-brand{flex-direction:column;gap:8px;padding:12px 8px}
.sb.mini .sb-collapse{margin-right:0;border:1px solid var(--bd);background:var(--s2)}
.sb.mini .sb-collapse:hover{border-color:var(--pr);color:var(--pr);background:var(--pr-soft)}
.sb.mini .sb-brand .nm,.sb.mini .sb-ws,.sb.mini .sb-sec,.sb.mini .sb-item span,.sb.mini .sb-item .n-badge,.sb.mini .sb-item .p-dot,.sb.mini .sb-item .chev,.sb.mini .sb-sub,.sb.mini .sb-user .nm,.sb.mini .sb-user>.ibtn{display:none}
.sb.mini .sb-item{justify-content:center;padding:8px}
.sb.mini .sb-item.on::before{right:-12px}
.sb.mini .sb-user{justify-content:center}
.sb.mini .sb-item[data-tip]::after,.sb.mini .ibtn[data-tip]::after{bottom:auto;top:50%;right:calc(100% + 10px);transform:translateY(-50%) scale(.94)}
.sb.mini .sb-item[data-tip]:hover::after,.sb.mini .ibtn[data-tip]:hover::after{transform:translateY(-50%) scale(1)}

/* topbar */
.tb{height:58px;flex:none;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--bd);background:var(--s1);position:sticky;top:0;z-index:30}
.tb-search{flex:1;min-width:0;max-width:480px;height:37px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:var(--r-md);background:var(--s2);border:1px solid var(--bd);color:var(--t3);font-size:13px;cursor:pointer;transition:all var(--tr);margin:0 auto}
.tb-search:hover{border-color:var(--bd2);color:var(--t2)}
.tb-l{display:flex;align-items:center;gap:8px;flex:none}
.tb-r{display:flex;align-items:center;gap:8px;flex:none;min-width:0}
.tb-page{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-bell{position:relative}
.tb-bell .n{position:absolute;top:3px;left:3px;width:8px;height:8px;border-radius:99px;background:var(--err);border:2px solid var(--s1)}
.tb-av{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 12px;border-radius:99px;cursor:pointer;border:1px solid transparent;background:transparent;transition:all var(--tr)}
.tb-av:hover{background:var(--s2);border-color:var(--bd)}
.tb-av b{font-size:12.5px;font-weight:600}
.tb-av span{font-size:10.5px;color:var(--t3);display:block;line-height:1.4}
.hamb{display:none}

/* ---------- dropdown menus ---------- */
.menu{position:fixed;z-index:80;min-width:196px;background:var(--s1);border:1px solid var(--bd2);border-radius:var(--r-md);padding:4px;box-shadow:none;animation:menuIn .14s ease}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.menu .mi{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;border-radius:7px;border:0;background:transparent;color:var(--t1);font-size:12.5px;font-weight:500;cursor:pointer;text-align:right;transition:background var(--tr)}
.menu .mi:hover{background:var(--s4)}
.menu .mi svg{color:var(--t3)}
.menu .mi.danger{color:var(--err)}
.menu .mi.danger svg{color:var(--err)}
.menu .mi.danger:hover{background:var(--err-soft)}
.menu .m-sep{height:1px;background:var(--bd);margin:4px 4px}
.menu .m-hd{padding:8px 12px 4px;font-size:10.5px;font-weight:500;color:var(--t3)}
.menu .mi .k{margin-right:auto;font-size:10.5px;color:var(--t3)}

/* ---------- overlays ---------- */
.ovl{position:fixed;inset:0;background:rgba(10,10,10,.62);z-index:60;animation:fade .18s ease}
[data-theme=light] .ovl{background:rgba(23,23,23,.4)}
.drawer{position:fixed;top:0;bottom:0;left:0;width:520px;max-width:96vw;background:var(--s1);border-right:1px solid var(--bd);z-index:61;display:flex;flex-direction:column;animation:drawIn .26s cubic-bezier(.3,.9,.3,1);box-shadow:none;}
@keyframes drawIn{from{transform:translateX(-30px);opacity:.5}to{transform:none;opacity:1}}
.drawer.w-lg{width:680px}
.drawer-h{display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--bd);flex:none}
.drawer-b{flex:1;overflow-y:auto;padding:24px}
.drawer-f{border-top:1px solid var(--bd);padding:12px 24px;display:flex;gap:8px;flex:none;background:var(--s1)}
.modal{position:fixed;z-index:61;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;pointer-events:none}
.modal .box{background:var(--s1);border:1px solid var(--bd2);border-radius:16px;width:100%;max-width:500px;max-height:92vh;overflow-y:auto;box-shadow:none;pointer-events:auto;animation:modalIn .22s cubic-bezier(.2,1,.3,1)}
@keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.975)}to{opacity:1;transform:none}}
.modal .box.w-lg{max-width:640px}
.m-h{display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--s1);z-index:2;border-radius:16px 16px 0 0}
.m-b{padding:24px}
.m-f{padding:16px 24px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-start;position:sticky;bottom:0;background:var(--s1);border-radius:0 0 16px 16px}

/* toasts */
.toasts{position:fixed;bottom:20px;left:20px;z-index:100;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{background:var(--s1);border:1px solid var(--bd2);border-radius:var(--r-md);padding:12px 16px;display:flex;align-items:flex-start;gap:12px;box-shadow:none;animation:toastIn .25s cubic-bezier(.2,1,.3,1);font-size:12.5px}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.toast.out{opacity:0;transform:translateY(6px);transition:all .25s}
.toast .ti{flex:none;margin-top:1px}
.toast.ok .ti{color:var(--ok)}.toast.err .ti{color:var(--err)}.toast.info .ti{color:var(--info)}.toast.warn .ti{color:var(--warn)}
.toast b{display:block;font-size:12.5px;font-weight:500}
.toast span{color:var(--t2);font-size:11.5px}
.toast .act{margin-right:auto;color:var(--pr3);font-weight:600;font-size:12px;cursor:pointer;border:0;background:none;padding:2px 4px;flex:none}

/* ---------- command palette ---------- */
.cmdp{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;pointer-events:none}
.cmdp .box{width:100%;max-width:600px;background:var(--s1);border:1px solid var(--bd2);border-radius:16px;box-shadow:none;pointer-events:auto;overflow:hidden;animation:modalIn .2s cubic-bezier(.2,1,.3,1);display:flex;flex-direction:column;max-height:64vh}
.cmd-in{display:flex;align-items:center;gap:12px;padding:16px 16px;border-bottom:1px solid var(--bd)}
.cmd-in input{flex:1;border:0;background:transparent;color:var(--t1);font-size:15px;font-family:var(--f)}
.cmd-in input:focus{outline:none}
.cmd-in input::placeholder{color:var(--t3)}
.cmd-list{overflow-y:auto;padding:8px}
.cmd-g{padding:8px 12px 4px;font-size:10.5px;font-weight:500;color:var(--t3)}
.cmd-i{display:flex;align-items:center;gap:12px;width:100%;padding:8px 12px;border-radius:var(--r-md);border:0;background:transparent;color:var(--t1);cursor:pointer;text-align:right;font-size:13px;font-weight:500}
.cmd-i svg{color:var(--t3)}
.cmd-i .sub{font-size:11px;color:var(--t3);font-weight:500;margin-right:auto;white-space:nowrap}
.cmd-i:hover,.cmd-i.sel{background:var(--pr-soft);color:var(--pr3)}
.cmd-i:hover svg,.cmd-i.sel svg{color:var(--pr3)}
.cmd-f{border-top:1px solid var(--bd);padding:8px 16px;display:flex;gap:16px;font-size:11px;color:var(--t3);background:var(--s1)}
.cmd-hl{color:var(--pr3);font-weight:600}

/* notifications drawer items */
.ntf{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--bd);transition:background var(--tr);position:relative}
.ntf:hover{background:var(--s2)}
.ntf.unread{background:var(--pr-soft);border-right:2px solid var(--pr)}
.ntf.unread::after{content:"";position:absolute;left:12px;top:50%;transform:translateY(-50%);width:7px;height:7px;border-radius:99px;background:var(--pr)}
.ntf .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
.ntf .ic.pr{background:var(--pr-soft);color:var(--pr3)}
.ntf .ic.ok{background:var(--ok-soft);color:var(--ok)}
.ntf .ic.warn{background:var(--warn-soft);color:var(--warn)}
.ntf .ic.err{background:var(--err-soft);color:var(--err)}
.ntf .ic.info{background:var(--info-soft);color:var(--info)}
.ntf p{font-size:12.5px;line-height:1.65}
.ntf p b{font-weight:600}
.ntf time{font-size:11px;color:var(--t3)}

/* datepicker popover */
.dp{position:fixed;z-index:85;background:var(--s1);border:1px solid var(--bd2);border-radius:14px;box-shadow:none;padding:12px;width:268px;animation:menuIn .15s ease}
.dp-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dp-h .t{flex:1;text-align:center;font-size:13px;font-weight:600}
.dp-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dp-g .wh{font-size:10.5px;color:var(--t3);font-weight:600;padding:4px 0}
.dp-g button{border:0;background:transparent;color:var(--t1);font-size:12px;font-weight:600;border-radius:7px;padding:8px 0;cursor:pointer;font-family:var(--f);transition:all var(--tr)}
.dp-g button:hover{background:var(--s4)}
.dp-g button.oth{color:var(--t3);opacity:.5}
.dp-g button.today{color:var(--pr3);font-weight:500}
.dp-g button.sel{background:var(--pr);color:#fff}
.dp-g button.hol{color:var(--err)}
.dp-f{display:flex;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--bd)}

@media (max-width:900px){.auth-bg{grid-template-columns:1fr;height:auto;min-height:100vh}.auth-art{display:none}.auth-side{padding:24px 16px;overflow:visible}}
/* ============================================================
   MODULES — kanban · calendar · dashboards · CRM · finance …
   ============================================================ */

/* ---------- kanban ---------- */
.kb{display:flex;gap:16px;align-items:flex-start;overflow-x:auto;padding-bottom:16px;min-height:420px}
.kb-col{width:288px;flex:none;background:var(--s1);border:1px solid var(--bd);border-radius:var(--r-lg);display:flex;flex-direction:column;max-height:calc(100vh - 268px);transition:border-color var(--tr),background var(--tr)}
.kb-col.dragover{border-color:var(--pr);background:var(--pr-soft)}
.kb-h{display:flex;align-items:center;gap:8px;padding:12px 16px 12px;flex:none}
.kb-h .t{font-size:13px;font-weight:600}
.kb-h .cnt{font-size:11px;background:var(--s3);border:1px solid var(--bd);color:var(--t2);border-radius:99px;padding:0 8px;line-height:1.8}
.kb-h .sum{margin-right:auto;font-size:11px;color:var(--t3);font-weight:600}
.kb-add{opacity:0;transition:opacity var(--tr)}
.kb-col:hover .kb-add{opacity:1}
.kb-body{padding:4px 12px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;flex:1}
.kb-card{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r-md);padding:12px;cursor:grab;transition:border-color var(--tr),transform var(--tr),box-shadow var(--tr);position:relative}
.kb-card:hover{border-color:var(--bd2);box-shadow:none;}
.kb-card:active{cursor:grabbing}
.kb-card.dragging{opacity:.45;transform:rotate(1.5deg) scale(.98)}
.kb-card .tt{font-size:13px;font-weight:600;line-height:1.65;margin-bottom:8px}
.kb-card .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.kb-f{display:flex;align-items:center;gap:8px}
.kb-f .sp{flex:1}
.kb-ico{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--t3);font-weight:500}
.due{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;border-radius:6px;padding:2px 8px;line-height:1.7}
.due.soon{background:var(--warn-soft);color:var(--warn)}
.due.over{background:var(--err-soft);color:var(--err)}
.due.ok{background:var(--ok-soft);color:var(--ok)}
.due.nrm{background:var(--s3);color:var(--t2)}
.prio{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:500;border-radius:5px;padding:1px 8px}
.prio.urgent{background:var(--err-soft);color:var(--err)}
.prio.high{background:var(--warn-soft);color:var(--warn)}
.prio.mid{background:var(--info-soft);color:var(--info)}
.prio.low{background:var(--s3);color:var(--t3)}

/* ---------- timeline ---------- */
.tl{border:1px solid var(--bd);border-radius:var(--r-lg);background:var(--s1);overflow:hidden}
.tl-scroll{overflow-x:auto}
.tl-in{min-width:900px;direction:rtl}
.tl-head{display:flex;border-bottom:1px solid var(--bd);background:var(--s2);position:sticky;top:0}
.tl-head .m{flex:1;padding:8px 12px;font-size:11.5px;font-weight:600;color:var(--t2);border-left:1px solid var(--bd);text-align:center}
.tl-row{display:flex;border-bottom:1px solid var(--bd);min-height:44px}
.tl-row:last-child{border-bottom:0}
.tl-row .lb{width:240px;flex:none;padding:8px 16px;border-left:1px solid var(--bd);display:flex;align-items:center;gap:8px;background:var(--s1);position:sticky;right:0;z-index:2}
.tl-track{flex:1;position:relative;display:flex}
.tl-track .tick{flex:1;border-left:1px dashed var(--bd)}
.tl-bar{position:absolute;top:10px;height:22px;border-radius:7px;background:var(--pr);opacity:.92;display:flex;align-items:center;padding:0 8px;font-size:10.5px;color:#fff;font-weight:600;white-space:nowrap;box-shadow:none;}
.tl-bar.done{background:var(--s4);color:var(--t2);box-shadow:none;}
.tl-bar.over{background:var(--err)}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--pr3);z-index:3}

/* ---------- calendar module ---------- */
.cal{border:1px solid var(--bd);border-radius:var(--r-lg);background:var(--s1);overflow:hidden}
.cal-h{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.cal-h .mo{font-size:16px;font-weight:600}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-wh{text-align:center;font-size:11px;font-weight:600;color:var(--t3);padding:8px 4px;border-bottom:1px solid var(--bd);background:var(--s2)}
.cal-wh.j{color:var(--err)}
.cal-d{min-height:112px;min-width:0;overflow:hidden;border-bottom:1px solid var(--bd);border-left:1px solid var(--bd);padding:8px;display:flex;flex-direction:column;gap:3px;transition:background var(--tr);cursor:pointer}
.cal-d:nth-child(7n){border-left:0}
.cal-d:hover{background:var(--s2)}
.cal-d.oth{opacity:.38}
.cal-d .n{font-size:12px;font-weight:600;color:var(--t2);width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:99px}
.cal-d.j .n{color:var(--err)}
.cal-d.today{background:var(--pr-soft)}
.cal-d.today .n{background:var(--pr);color:#fff}
.ev{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px;line-height:1.8;min-width:0;max-width:100%}
.ev>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.meet{background:var(--pr-soft);color:var(--pr3)}
.ev.task{background:var(--warn-soft);color:var(--warn)}
.ev.dead{background:var(--err-soft);color:var(--err)}
.ev.leave{background:var(--ok-soft);color:var(--ok)}
.ev.more{color:var(--t3);background:var(--s3)}
.cal-side{display:flex;flex-direction:column;gap:16px}
.agenda{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd);align-items:flex-start}
.agenda:last-child{border-bottom:0}
.agenda .tm{width:56px;flex:none;text-align:center;font-size:12px;font-weight:600;color:var(--pr3);line-height:1.5}
.agenda .bd{flex:1;min-width:0}
.agenda .bd b{display:block;font-size:12.5px;font-weight:600;margin-bottom:2px}
.agenda .bd p{font-size:11.5px;color:var(--t3);line-height:1.6}

/* ---------- dashboard widgets ---------- */
.msn-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.msn{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r-md);padding:12px 16px;display:flex;align-items:center;gap:12px}
.msn .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.msn b{display:block;font-size:19px;font-weight:600;line-height:1.4}
.msn span{display:block;font-size:11px;color:var(--t3);font-weight:500}
.todo{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}
.todo:last-child{border-bottom:0}
.todo .bd{flex:1;min-width:0}
.todo .bd b{display:block;font-size:13px;font-weight:600;line-height:1.6}
.todo .bd p{font-size:11.5px;color:var(--t3)}
.feed{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}
.feed:last-child{border-bottom:0}
.feed .dot{width:8px;height:8px;border-radius:99px;margin-top:8px;flex:none;background:var(--pr3)}
.feed p{font-size:12.5px;line-height:1.65}
.feed time{font-size:11px;color:var(--t3)}
.loadbar{display:flex;align-items:center;gap:12px;padding:8px 0}
.loadbar .nm{width:118px;flex:none;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loadbar .prog{flex:1}
.loadbar .pc{width:36px;text-align:left;font-size:11.5px;color:var(--t2);font-weight:500;flex:none}
.meet-mini{display:flex;gap:12px;align-items:flex-start;padding:12px 12px;border:1px solid var(--bd);border-radius:var(--r-md);background:var(--s2);margin-bottom:8px}
.meet-mini .tm{width:52px;flex:none;text-align:center;border-right:2px solid var(--pr);padding-right:8px}
.meet-mini .tm b{display:block;font-size:13px;font-weight:600;color:var(--pr3)}
.meet-mini .tm span{font-size:10px;color:var(--t3)}
.meet-mini .bd{flex:1;min-width:0}
.meet-mini .bd b{display:block;font-size:12.5px;font-weight:600}
.meet-mini .bd p{font-size:11px;color:var(--t3)}
.appr{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}
.appr:last-child{border-bottom:0}
.appr .bd{flex:1;min-width:0}
.appr .bd b{font-size:12.5px;display:block;font-weight:600}
.appr .bd span{font-size:11px;color:var(--t3)}
.mission-pop .box{max-width:640px;overflow:hidden}
.mission-li{background:var(--s2);border:1px solid var(--bd);border-radius:9px;padding:8px 12px}
.mission-pop .t-h2{font-size:22px}
.mission-hero{padding:24px 24px 16px;border-bottom:1px solid var(--bd)}

/* ---------- CRM pipeline ---------- */
.pipe-sum{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-bottom:16px}
.pipe-sum .st{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r-md);padding:12px 12px}
.pipe-sum .st b{display:block;font-size:13px;font-weight:600}
.pipe-sum .st span{font-size:11px;color:var(--t3)}
.pipe-sum .st .bar{height:3px;border-radius:99px;background:var(--s4);margin-top:8px;overflow:hidden}
.pipe-sum .st .bar i{display:block;height:100%;background:var(--pr)}
.lead-card{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r-md);padding:12px;cursor:grab;transition:all var(--tr)}
.lead-card:hover{border-color:var(--bd2)}
.lead-card.dragging{opacity:.45}
.lead-card .co{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.lead-card .co .co-t{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none;color:#fff}
.lead-card .co b{font-size:12.5px;font-weight:600;display:block;line-height:1.5}
.lead-card .co span{font-size:11px;color:var(--t3);display:block;line-height:1.5}
.lead-card .val{font-size:13px;font-weight:600;margin:4px 0}
.lead-card .foot{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11px;color:var(--t3)}

/* ---------- customer 360 ---------- */
.cust-hero{display:flex;align-items:center;gap:16px;padding:24px 24px;flex-wrap:wrap}
.cust-tile{width:58px;height:58px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;color:#fff;flex:none}
.sub-tab-body{padding:16px 24px}

/* ---------- invoice / paper ---------- */
.paper-wrap{display:flex;justify-content:center;padding:8px 0 24px;background:var(--bg)}
.paper{width:100%;max-width:820px;background:#fcfbfa;color:#26221f;border-radius:14px;padding:40px 48px;box-shadow:none;border:1px solid var(--bd);position:relative;overflow:hidden}
.paper *{color:inherit}
.paper .pl{color:#8a837c}
.paper h2{font-size:19px;font-weight:600;color:#1c1917}
.paper table{width:100%;border-collapse:collapse;font-size:12.5px}
.paper table th{background:#f4f1ee;color:#6b645c;font-size:11px;font-weight:600;padding:8px 12px;text-align:right;border-bottom:1px solid #e7e2dc}
.paper table td{padding:12px 12px;border-bottom:1px solid #efeae4;color:#33302c}
.paper .tot td{border-bottom:0;padding:8px 12px}
.paper .grand{background:#1c1917;color:#fff!important;border-radius:10px}
.paper .grand td{color:#fff}
.stamp{position:absolute;top:34px;left:44px;border:2px solid;border-radius:10px;padding:8px 16px;font-size:13px;font-weight:600;letter-spacing:1px;transform:rotate(-8deg)}
.stamp.paid{color:#1d7a53;border-color:#1d7a53}
.stamp.pend{color:#b8860b;border-color:#d9a521}
.paper-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;padding-bottom:24px;border-bottom:2px solid #1c1917;margin-bottom:24px}
.paper-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;font-size:12.5px}
@media print{
  body{background:#fff}
  .sb,.tb,.toasts,.no-print,.ovl{display:none!important}
  .paper-wrap{padding:0}
  .paper{box-shadow:none;border:0;border-radius:0;max-width:100%}
  .main{padding:0}
}

/* ---------- social ---------- */
.soc-acct{display:flex;align-items:center;gap:16px;padding:16px}
.plat-ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.plat-ic.instagram{background:#ee2a7b}
.plat-ic.youtube{background:#c4302b}
.plat-ic.linkedin{background:#0a66c2}
.plat-ic.tiktok{background:#171717;border:1px solid var(--bd2)}
.plat-ic.facebook{background:#1877f2}
.plat-ic.telegram{background:#229ed9}
.post-thumb{width:44px;height:44px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;position:relative}
.post-thumb.reel{background:var(--pr)}
.post-thumb.carousel{background:#0d9488}
.post-thumb.post{background:#d97706}
.post-thumb .pl{position:absolute;bottom:3px;left:4px;font-size:8px;font-weight:600}
.metric-mini{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.metric-mini b{font-size:13px;font-weight:600}
.metric-mini span{font-size:10.5px;color:var(--t3);font-weight:600}
.rpt-pg{background:#fcfbfa;color:#26221f;border-radius:14px;border:1px solid var(--bd);padding:32px 42px;min-height:400px}
.rpt-pg *{color:inherit}
.rpt-cover{background:#5853e0;border-radius:12px;color:#fff;padding:24px;margin:-8px -8px 24px}
.rpt-cover *{color:#fff}

/* ---------- RBAC ---------- */
.rbac-mat{overflow:auto;border:1px solid var(--bd);border-radius:var(--r-lg);background:var(--s1)}
.rbac-mat table{border-collapse:separate;border-spacing:0;min-width:820px;width:100%}
.rbac-mat th{position:sticky;top:0;background:var(--s2);font-size:11px;color:var(--t3);padding:8px 8px;border-bottom:1px solid var(--bd);z-index:2;white-space:nowrap}
.rbac-mat td{padding:8px 8px;border-bottom:1px solid var(--bd);text-align:center}
.rbac-mat td.rn{text-align:right;font-size:12.5px;font-weight:600;white-space:nowrap;position:sticky;right:0;background:var(--s1);border-left:1px solid var(--bd)}
.rbac-mat tr:hover td.rn{background:var(--s2)}
.mx{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--bd2);background:var(--s2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--tr);vertical-align:middle}
.mx svg{opacity:0;transform:scale(.4);transition:all var(--tr);color:#fff}
.mx.on{background:var(--pr);border-color:var(--pr)}
.mx.on svg{opacity:1;transform:scale(1)}
.mx.half{background:var(--pr-soft);border-color:var(--pr2)}
.mx.half::after{content:"";width:8px;height:2px;border-radius:2px;background:var(--pr3)}
.mx:hover{border-color:var(--pr3)}
.role-li{display:flex;align-items:center;gap:12px;width:100%;padding:12px 12px;border-radius:var(--r-md);border:1px solid transparent;background:transparent;cursor:pointer;text-align:right;transition:all var(--tr)}
.role-li:hover{background:var(--s2)}
.role-li.on{background:var(--s1);border-color:var(--bd);box-shadow:none;}
.role-li b{display:block;font-size:12.5px;font-weight:500}
.role-li span{display:block;font-size:10.5px;color:var(--t3)}
.role-li .cnt{margin-right:auto;font-size:10.5px;color:var(--t3);background:var(--s2);border:1px solid var(--bd);border-radius:99px;padding:0 8px;line-height:1.8}
.role-li.on .cnt{background:var(--pr-soft);color:var(--pr3);border-color:transparent}

/* ---------- integrations ---------- */
.int-card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px;transition:all var(--tr)}
.int-card:hover{border-color:var(--bd2);box-shadow:none;}
.int-logo{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#fff;flex:none}
.int-logo.gr{background:var(--s3);color:var(--t2);border:1px solid var(--bd)}
.key-mask{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12.5px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r-md);padding:8px 12px;display:flex;align-items:center;gap:8px;direction:ltr;justify-content:flex-start}
.key-mask .k{color:var(--t2);letter-spacing:1px}

/* ---------- activity ---------- */
.act-row{display:flex;gap:12px;align-items:flex-start;position:relative;padding:0 0 16px 0}
.act-row::before{content:"";position:absolute;right:15px;top:34px;bottom:0;width:1px;background:var(--bd)}
.act-row:last-child::before{display:none}
.act-ic{width:32px;height:32px;border-radius:99px;background:var(--s3);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--t2);flex:none;z-index:1}
.act-ic.pr{background:var(--pr-soft);color:var(--pr3);border-color:transparent}
.act-ic.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.act-ic.err{background:var(--err-soft);color:var(--err);border-color:transparent}

/* ---------- charts ---------- */
.chart-lbls{display:flex;justify-content:space-between;padding:8px 4px 0;font-size:10.5px;color:var(--t3);font-weight:500}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--t2);font-weight:500}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-left:4px}

/* ---------- filterbar ---------- */
.filterbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;background:var(--s1);border:1px solid var(--bd);border-radius:var(--r-lg);margin-bottom:16px}
.filterbar .lb{font-size:11.5px;font-weight:500;color:var(--t3);display:flex;align-items:center;gap:4px;margin-left:2px}
.fsel{height:32px;padding:0 8px 0 24px;font-size:12.5px;border-radius:var(--r-sm);min-width:130px}
.bulkbar{display:flex;align-items:center;gap:12px;background:var(--pr-soft);border:1px solid var(--pr2);border-radius:var(--r-md);padding:8px 16px;margin-bottom:12px;font-size:12.5px;font-weight:600;color:var(--pr3);animation:fade .2s}

/* ---------- misc module bits ---------- */
.status-step{display:flex;align-items:center;gap:0;flex-wrap:wrap}
.status-step .st{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:74px}
.status-step .st i{width:22px;height:22px;border-radius:99px;border:2px solid var(--bd2);display:flex;align-items:center;justify-content:center;background:var(--s2);color:transparent;font-style:normal}
.status-step .st.on i{border-color:var(--pr);background:var(--pr);color:#fff}
.status-step .st.done i{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.status-step .st span{font-size:10.5px;font-weight:600;color:var(--t3)}
.status-step .st.on span{color:var(--t1)}
.status-step .ln{height:2px;flex:1;min-width:18px;background:var(--bd2);margin:0 4px 24px}
.status-step .ln.done{background:var(--ok)}
.bank-card{border:1px solid var(--bd);border-radius:var(--r-lg);padding:16px;background:var(--s2);position:relative;overflow:hidden}
.bank-card::after{content:"";position:absolute;top:12px;left:12px;width:44px;height:44px;border-radius:10px;border:1px solid var(--pr-soft2)}
.skill{display:inline-flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--bd);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:600;color:var(--t2)}
.webkit{display:flex;gap:12px;flex-wrap:wrap}
.webkit .wk{flex:1;min-width:150px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r-md);padding:12px 16px}
.webkit .wk b{display:block;font-size:12px;font-weight:600;color:var(--t2)}
.webkit .wk span{display:block;font-size:10.5px;color:var(--t3)}

/* ---------- responsive ---------- */
@media (max-width:1280px){
  .grid-6{grid-template-columns:repeat(3,1fr)}
  .pipe-sum{grid-template-columns:repeat(4,1fr)}
  .msn-grid{grid-template-columns:repeat(2,1fr)}
  .hide-lg{display:none!important}
}
@media (max-width:1024px){
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .sb{position:fixed;right:0;top:0;transform:translateX(100%);visibility:hidden;transition:transform .24s ease,visibility 0s .24s;box-shadow:none;}
  .sb.open{transform:none;visibility:visible;transition:transform .24s ease}
  .hamb{display:inline-flex}
  .main{padding:24px 24px 48px}
  .pg{padding:16px 24px 48px}
  .sb-veil{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:39;animation:fade .2s}
}
@media (max-width:768px){
  .grid-2,.grid-3,.grid-6{grid-template-columns:1fr}
  .pipe-sum{grid-template-columns:repeat(2,1fr)}
  .tb-av .txt,.tb .tb-ws-txt{display:none}
  .pg{padding:16px 16px 40px}
  .paper{padding:24px 24px}
  .drawer{width:100%;max-width:100%;border:0}
  .frow,.frow3{grid-template-columns:1fr}
  .msn-grid{grid-template-columns:1fr 1fr}
  /* tables → cards */
  .tbl.mobilize thead{display:none}
  .tbl.mobilize,.tbl.mobilize tbody,.tbl.mobilize tr,.tbl.mobilize td{display:block;width:100%}
  .tbl.mobilize tbody tr{border:1px solid var(--bd);border-radius:var(--r-md);margin-bottom:12px;background:var(--s1);overflow:hidden}
  .tbl.mobilize tbody tr:hover{background:var(--s1)}
  .tbl.mobilize td{border-bottom:1px solid var(--bd);padding:8px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left}
  .tbl.mobilize td::before{content:attr(data-l);font-size:11px;color:var(--t3);font-weight:600;text-align:right;flex:none}
  .tbl.mobilize td.num{direction:rtl}
  .tbl.mobilize td.full{display:block;text-align:right}
  .filterbar{position:fixed;bottom:-1px;right:0;left:0;z-index:50;margin:0;border-radius:16px 16px 0 0;flex-direction:column;align-items:stretch;transform:translateY(102%);transition:transform .25s ease;box-shadow:none;display:none}
  .filterbar.open{transform:none;display:flex}
  .filterbar .fb-sheet-hd{display:flex}
  .fbtn-mob{display:inline-flex!important}
  .cal-d{min-height:64px}
  .ev span{display:none}
  .ev::before{content:"";width:5px;height:5px;border-radius:99px;background:currentColor;flex:none}
}
.fb-sheet-hd{display:none}
.fbtn-mob{display:none}

/* ---------- layout hardening ---------- */
@media (max-width:900px){
  #rbac-wrap{grid-template-columns:1fr!important}
  #dash-grid{grid-template-columns:1fr!important}
  #soc-wrap,#fin-wrap{grid-template-columns:1fr!important}
}
@media (max-width:640px){
  .grid-4{grid-template-columns:1fr}
  .tb{gap:8px;padding:0 12px}
  .tb .tb-cal,.tb .tb-help{display:none}
  .tb-search kbd{display:none}
  .pg-head{flex-direction:column;align-items:stretch}
  .pg-actions{width:100%}
  .pg-actions .btn{flex:1}
  .msn-grid{gap:8px}
}

.auth-demo-note{display:flex;align-items:flex-start;gap:8px;margin-bottom:16px;padding:10px 12px;border:1px solid var(--warn);border-radius:var(--r-md);background:var(--warn-soft);color:var(--t2);font-size:12px;line-height:1.8}
.auth-demo-note svg{flex:none;margin-top:4px;color:var(--warn)}
.auth-demo-note code{direction:ltr;unicode-bidi:isolate;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--t1);font-size:11px}

/* ---------- responsive split grids (collapse on small screens) ---------- */
.grid-split{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.grid-split-eq{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.grid-split-b{grid-template-columns:320px minmax(0,1fr)}
@media (max-width:1024px){
  .grid-split,.grid-split-eq,.grid-split-b{grid-template-columns:1fr}
  #soc-wrap,#fin-wrap,#rbac-wrap,#dash-grid{grid-template-columns:1fr!important}
}

/* calendar header — mobile compression */
@media (max-width:640px){
  .cal-h{gap:8px}
  .cal-h .mo{font-size:14px}
  .cal-h .row{flex-wrap:wrap}
  .seg button{padding:4px 8px;font-size:11.5px}
}

/* calendar layout — stack with side panel on small screens */
@media (max-width:1024px){
  .cal-wrap{flex-wrap:wrap}
  .cal-side{width:100%!important;flex:none!important}
}
/* ============================================================
   EFFECT ERP · Feature components — avatars, labels, checklists,
   assets, brand kit, content plan, banking, approvers (04)
   ============================================================ */

/* ---------- avatar scale: 24/32/40/48/64/80 ---------- */
.av{width:32px;height:32px;font-size:12px;font-weight:500;color:#fff;position:relative}
.av.xs{width:24px;height:24px;font-size:10px}
.av.sm{width:32px;height:32px;font-size:12px}
.av.md{width:40px;height:40px;font-size:14px}
.av.lg{width:48px;height:48px;font-size:16px}
.av.xl{width:64px;height:64px;font-size:20px}
.av.xxl{width:80px;height:80px;font-size:26px}
.av.photo{background-color:var(--s3);background-size:400% 400%;image-rendering:auto}
.av[data-emp]:not(.static){cursor:pointer}
.av .st{position:absolute;bottom:0;left:0;width:10px;height:10px;border-radius:99px;border:2px solid var(--s1)}
.av.xs .st{width:8px;height:8px;border-width:1.5px}
.av.xxl .st{width:14px;height:14px;border-width:3px}
.av-stack .av{margin-left:-8px;border:2px solid var(--s1)}
.av-stack .av.xs{margin-left:-6px}

/* ---------- task labels ---------- */
.lb{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:6px;font-size:11px;font-weight:500;line-height:1.9;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb i{width:6px;height:6px;border-radius:99px;flex:none}
.lb-add{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:6px;font-size:11px;font-weight:500;background:var(--s2);border:1px dashed var(--bd2);color:var(--t3);cursor:pointer;line-height:1.9}
.lb-add:hover{color:var(--pr);border-color:var(--pr)}
.lb-swatch{width:26px;height:26px;border-radius:8px;border:1px solid var(--bd);cursor:pointer;position:relative;flex:none;padding:0}
.lb-swatch.on{outline:2px solid var(--t1);outline-offset:2px}
.lb-dot{width:10px;height:10px;border-radius:99px;display:inline-block;flex:none}
.kb-lbs{display:flex;gap:4px;flex-wrap:wrap;min-width:0}

/* ---------- checklist ---------- */
.ck-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--s1);margin-bottom:6px}
.ck-item.dragover{border-color:var(--pr)}
.ck-item .txt{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck-item.done .txt{color:var(--t3);text-decoration:line-through}
.ck-item .ord{display:flex;flex-direction:column;gap:1px}
.ck-item .ord button{width:18px;height:14px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:var(--t3);cursor:pointer;border-radius:4px;padding:0}
.ck-item .ord button:hover{background:var(--s2);color:var(--t1)}
.ck-add{display:flex;gap:8px;margin-top:4px}
.ck-add input{height:34px}

/* ---------- scope bar (task views) ---------- */
.scopebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:var(--s1);border:1px solid var(--bd);border-radius:10px;margin-bottom:16px}
.scopebar .lb-t{font-size:11.5px;font-weight:500;color:var(--t3);display:flex;align-items:center;gap:5px}

/* ---------- asset library ---------- */
.dropzone{border:1.5px dashed var(--bd2);border-radius:12px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--t3);transition:all var(--tr);cursor:pointer;background:var(--s1)}
.dropzone:hover,.dropzone.dragover{border-color:var(--pr);color:var(--pr);background:var(--pr-soft)}
.dropzone b{font-size:13px;font-weight:500;color:var(--t1)}
.folder-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:500;background:var(--s2);border:1px solid var(--bd);color:var(--t2);cursor:pointer;line-height:1.8}
.folder-chip.on{background:var(--pr-soft);border-color:var(--pr2);color:var(--pr)}
.file-ic{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--s2);border:1px solid var(--bd);color:var(--t2)}
.file-ic.img{color:var(--pr)}
.asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.asset-card{border:1px solid var(--bd);border-radius:10px;padding:12px;background:var(--s1);display:flex;flex-direction:column;gap:8px;min-width:0}
.asset-card .nm{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:right}
.asset-card:hover{border-color:var(--bd2)}

/* ---------- brand kit ---------- */
.brand-hero{display:flex;gap:16px;align-items:flex-start;padding:20px;border:1px solid var(--bd);border-radius:12px;background:var(--s1);flex-wrap:wrap}
.brand-logo-tile{width:72px;height:72px;border-radius:14px;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:22px;flex:none}
.swatch{display:flex;flex-direction:column;gap:6px;align-items:center;min-width:0}
.swatch .box{width:100%;height:52px;border-radius:10px;border:1px solid var(--bd)}
.swatch code{font-size:11px;color:var(--t2);direction:ltr;font-family:ui-monospace,Menlo,monospace}
.color-inp{width:36px;height:32px;padding:2px;border:1px solid var(--bd);border-radius:8px;background:var(--s1);cursor:pointer;flex:none}
.brief-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.brief-f{border:1px solid var(--bd);border-radius:10px;padding:12px 14px;background:var(--s1);min-width:0}
.brief-f.wide{grid-column:1/-1}
.brief-f .k{font-size:11.5px;font-weight:500;color:var(--t3);display:flex;align-items:center;gap:6px;margin-bottom:4px}
.brief-f .v{font-size:13px;line-height:1.8;overflow-wrap:break-word}

/* ---------- content plan ---------- */
.plan-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.plan-row:last-child{border-bottom:0}
.plan-row .nm{width:130px;flex:none;font-size:13px;display:flex;align-items:center;gap:8px;min-width:0}
.plan-row .prog{flex:1;min-width:120px}
.plan-row .cnt{font-size:12px;color:var(--t2);font-weight:500;white-space:nowrap}
.plan-row .pct{width:44px;text-align:left;font-size:12px;font-weight:600;color:var(--t1)}
.con-cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.con-cal .h{text-align:center;font-size:10.5px;font-weight:500;color:var(--t3);padding:8px 4px;background:var(--s2);border-bottom:1px solid var(--bd)}
.con-cal .d{min-height:56px;border-left:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.con-cal .d:nth-child(7n){border-left:0}
.con-cal .d .n{font-size:10.5px;color:var(--t3);font-weight:500}
.con-pill{font-size:9.5px;font-weight:500;border-radius:5px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- banking ---------- */
.bank-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--s1);min-width:0;flex-wrap:wrap}
.bank-row .k{width:130px;flex:none;font-size:12px;color:var(--t3);display:flex;align-items:center;gap:8px}
.bank-row .v{font-size:13.5px;font-weight:500;direction:ltr;font-family:ui-monospace,Menlo,monospace;letter-spacing:.5px;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:80px;text-align:right}
.sec-banner{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--s2);font-size:12px;color:var(--t2);margin-bottom:16px;flex-wrap:wrap}

/* ---------- approver selector ---------- */
.ap-list{display:flex;flex-direction:column;gap:8px;max-height:240px;overflow-y:auto;border:1px solid var(--bd);border-radius:10px;padding:8px;background:var(--s1)}
.ap-item{display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;border:1px solid transparent;border-radius:10px;background:transparent;cursor:pointer;text-align:right;transition:all var(--tr)}
.ap-item:hover{background:var(--s2)}
.ap-item.on{border-color:var(--pr2);background:var(--pr-soft)}
.ap-item .who{flex:1;min-width:0;text-align:right}
.ap-item .who b{display:block;font-size:13px;font-weight:500}
.ap-item .who span{display:block;font-size:11px;color:var(--t3)}
.ap-item .rad-bx{width:18px;height:18px;border-radius:99px;border:1.5px solid var(--bd2);display:inline-flex;align-items:center;justify-content:center;flex:none}
.ap-item.on .rad-bx{border-color:var(--pr)}
.ap-item.on .rad-bx::after{content:"";width:9px;height:9px;border-radius:99px;background:var(--pr)}

/* ---------- photo upload ---------- */
.photo-up{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px;border:1.5px dashed var(--bd2);border-radius:12px;background:var(--s1)}

@media (max-width:640px){
  .brief-grid{grid-template-columns:1fr}
  .plan-row .nm{width:100px}
  .brand-hero{gap:12px}
}

/* ---------- customer project hub (v2.3) ---------- */
.cp-hero{display:flex;align-items:center;gap:16px;padding:16px 24px;flex-wrap:wrap}
.cp-logo{width:56px;height:56px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:none}
.min0{min-width:0}
.chip.dim{opacity:.55}
.chip.chip-sel{background:var(--pr-soft);border-color:var(--pr);color:var(--pr2)}
.chip.chip-sel svg{color:var(--pr)}

/* content plan calendar */
.cp-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cp-cal-h{text-align:center;font-size:11px;color:var(--t3);padding:4px 0;font-weight:500}
.cp-cal-d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:11.5px;border-radius:8px;color:var(--t2);border:1px solid transparent}
.cp-cal-d.has{background:var(--pr-soft);color:var(--pr2);font-weight:500}
.cp-cal-d.today{border-color:var(--pr);color:var(--pr2);font-weight:600}
.cp-dot{width:10px;height:10px;border-radius:99px;background:var(--pr-soft);border:1px solid var(--pr);display:inline-block;flex:none}
.plan-row.plan-hd{border-bottom:1px solid var(--bd2);padding:6px 0}
.plan-row.plan-hd .nm,.plan-row.plan-hd .pc{font-size:11px;color:var(--t3);font-weight:500}
.plan-row.plan-tot{border-top:1px solid var(--bd2);font-weight:600}
.plan-row.plan-tot .nm{font-weight:600}

/* bar chart (reports) */
.bar-chart{display:flex;align-items:flex-end;justify-content:space-around;gap:8px;min-height:170px;padding-top:8px}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.bar-col .bar{width:100%;min-width:28px;max-width:56px;background:rgba(111,106,235,.35);border:1px solid rgba(111,106,235,.75);border-bottom:0;border-radius:8px 8px 0 0;transition:background .18s}
.bar-col:hover .bar{background:rgba(111,106,235,.75)}
.bar-col.sel .bar{background:rgba(111,106,235,.92)}
.bar-col .bar-val{font-size:12px;color:var(--t1);font-weight:500}
.bar-col .bar-lb{font-size:11px;color:var(--t3);white-space:nowrap}

/* asset cards v2 */
.asset-card{flex-direction:row;align-items:center}
.asset-th{flex:none}
.asset-ic{width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.asset-ic.lg{width:72px;height:72px}
.asset-acts{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* brand swatches */
.swatch-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.swatch-row:last-child{border-bottom:0}
.swatch{width:28px;height:28px;border-radius:8px;border:1px solid var(--bd2);display:inline-block;flex:none}
.swatch.lg{width:36px;height:36px}
.swatch.xl{width:56px;height:56px;border-radius:12px}
.swatch-row .grow{min-width:0}
.swatch-row .grow b{display:block;font-size:13px;font-weight:500}
.swatch-row .grow span{display:block;font-size:11.5px;color:var(--t3);direction:ltr;text-align:right}

/* leave flow + approver picker */
.lv-flow{border:1px solid var(--bd);border-radius:10px;padding:12px;background:var(--s1)}
.kpi.dimmed .k-v,.kpi.dimmed .k-l{opacity:.6}

/* photo avatar status ring */
.avwrap{position:relative}
.avwrap.st-ok::after,.avwrap.st-off::after,.avwrap.st-leave::after{content:"";position:absolute;left:2px;bottom:2px;width:10px;height:10px;border-radius:99px;border:2px solid var(--s1)}
.avwrap.st-ok::after{background:var(--ok)}
.avwrap.st-off::after{background:var(--t3)}
.avwrap.st-leave::after{background:var(--warn)}

/* kb empty col */
.kb-empty{padding:16px 8px;text-align:center;color:var(--t3);font-size:12px}

/* label management rows */
.lb-mng{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap;min-width:0}
.lb-mng:last-of-type{border-bottom:0}
.lb-mng .lb{min-width:88px}

/* ---------- report builder v2 (v2.4) ---------- */
.rpt-steps{row-gap:4px}
.src-opt{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--s1);cursor:pointer;text-align:right;transition:all var(--tr);min-width:0;flex:1}
.src-opt .ic{width:36px;height:36px;border-radius:10px;background:var(--s2);display:inline-flex;align-items:center;justify-content:center;color:var(--t2);flex:none}
.src-opt .tx{min-width:0}
.src-opt .tx b{display:block;font-size:13px;font-weight:500}
.src-opt .tx span{display:block;font-size:11.5px;color:var(--t3)}
.src-opt:hover{border-color:var(--bd2)}
.src-opt.on{border-color:var(--pr);background:var(--pr-soft)}
.src-opt.on .ic{background:var(--pr);color:#fff}
.src-opt:disabled{opacity:.55;cursor:not-allowed}
.mp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ch-bars rect{transition:fill-opacity .18s}
.ch-bars .cbar-g:hover rect{fill-opacity:.75}
.rpt-pg table.tb th{font-size:11px;color:#8a837c;font-weight:500;padding:8px 6px;border-bottom:1px solid #eee;white-space:nowrap}
.rpt-pg table.tb td{padding:6px;white-space:nowrap}

/* ---------- ماتریس دسترسی (v2.5) ---------- */
.perm-mx{border:1px solid var(--bd);border-radius:10px;overflow-x:auto;background:var(--s1)}
.perm-hd,.perm-row{display:grid;grid-template-columns:minmax(140px,1.6fr) repeat(7,44px);align-items:center}
.perm-hd{padding:8px 12px;background:var(--s2);border-bottom:1px solid var(--bd);font-size:11px;color:var(--t3);font-weight:500;min-width:520px}
.perm-hd span:not(:first-child){text-align:center}
.perm-row{padding:6px 12px;border-bottom:1px solid var(--bd);min-width:520px}
.perm-row:last-child{border-bottom:0}
.perm-row .pm-t{font-size:12.5px;display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.perm-row .pm-t .badge,.perm-row .pm-t .t-cap{font-size:10px;flex:none}
.perm-row>span:not(.pm-t){text-align:center}
.ptgl{width:26px;height:26px;border-radius:7px;border:1px solid var(--bd);background:var(--s2);color:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all var(--tr)}
.ptgl.on{background:var(--pr);border-color:var(--pr);color:#fff}
.ptgl:hover{border-color:var(--pr)}

/* ===== v2.6 · task form drawer (left) + assignee dropdown + checklist editor ===== */
.dw-tf{width:560px}
.tf-h{display:flex;align-items:center;gap:8px;margin:18px 0 10px;font-size:11.5px;font-weight:700;color:var(--t3)}
.tf-h svg{color:var(--pr)}
.tf-h::after{content:'';flex:1;height:1px;background:var(--bd)}
.dw-tf .drawer-b{padding:16px 20px 24px}
.dw-tf .drawer-f{padding:12px 20px}
.ck-inp{height:32px;font-size:13px}
.ck-item .ckb{flex:none}
.ck-item .ibtn{flex:none}
/* assignee multi-select field */
.asg-fld .hint{margin-top:6px}
.asg-box{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:42px;padding:6px 10px;border:1.5px solid var(--bd2);border-radius:9px;background:var(--s2);cursor:pointer;transition:border-color var(--tr)}
.asg-box:hover,.asg-box:focus-visible,.asg-box.open{border-color:var(--pr2);outline:none}
.asg-box .chip{margin:0}
.asg-ph{color:var(--t3);font-size:13px}
.asg-chev{color:var(--t3);display:inline-flex;flex:none;transition:transform var(--tr)}
.asg-box.open .asg-chev{transform:rotate(180deg)}
.asg-clr{flex:none}
/* dropdown panel */
.asg-dd{position:fixed;z-index:86;background:var(--s1);border:1px solid var(--bd2);border-radius:11px;display:flex;flex-direction:column;overflow:hidden;box-shadow:none;animation:menuIn .14s ease}
.asg-dd-q{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--bd);color:var(--t3);flex:none}
.asg-dd-q input{border:0;background:transparent;outline:0;flex:1;min-width:0;font-family:inherit;font-size:13px;color:var(--t1)}
.asg-dd-list{overflow-y:auto;max-height:216px;padding:6px}
.asg-opt{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border:0;background:transparent;border-radius:8px;cursor:pointer;text-align:right;font-family:inherit}
.asg-opt:hover,.asg-opt.hl{background:var(--s2)}
.asg-opt .who{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
.asg-opt .who b{font-size:12.5px;font-weight:600;color:var(--t1)}
.asg-opt .who span{font-size:10.5px;color:var(--t3)}
.asg-bx{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--bd2);background:var(--s1);display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:none;transition:all var(--tr)}
.asg-bx svg{opacity:0;transform:scale(.5);transition:all var(--tr)}
.asg-opt.sel .asg-bx{background:var(--pr);border-color:var(--pr)}
.asg-opt.sel .asg-bx svg{opacity:1;transform:scale(1)}
.asg-dd-empty{padding:14px;text-align:center;color:var(--t3);font-size:12.5px}
.asg-dd-f{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;border-top:1px solid var(--bd);flex:none}
@media (max-width:640px){
  .dw-tf{width:100vw;max-width:100vw}
  .asg-dd{left:8px!important;right:8px;width:auto!important}
  .frow{grid-template-columns:1fr}
}

function avPos(idx){ const col=idx%4,row=Math.floor(idx/4); return `${(col/3*100).toFixed(0)}% ${(row/3*100).toFixed(0)}%`; }
function av(name,size,cls){
  if(typeof EMP!=='undefined'){EMP.forEach(e=>{if(!(e.name in EMP_BY_NAME))EMP_BY_NAME[e.name]=e;});}
  const sz=size||'md';
  const slot=avSlot(name);

    return `<span class="av photo ${sz} ${cls||''}" role="img" aria-label="${esc(name)}" data-emp="${e.id||''}" style="background-image:url(${AV_IMG});background-position:${avPos(slot)}"></span>`;
  }
  return `<span class="av ${sz} ${cls||''}" style="background:${avHue(name)}" data-emp="${(EMP_BY_NAME[name]||{}).id||''}" aria-hidden="true">${initials(name)}</span>`;
}

function avStack(names,n){const shown=names.slice(0,n||3),rest=names.length-shown.length;

  if(rest>0)h+=`<span class="av xs" style="background:var(--s4);color:var(--t2);border-color:var(--s1)">+${fa(rest)}</span>`;

  const done=t.ck?t.ck[0]:0, total=Math.max(t.ck?t.ck[1]:0,0);
  t.checklist=CK_POOL.slice(0,total).map((x,i)=>ckItem(t.id,x,i,i<done));
 });
 TASKS.forEach(t=>{ t.labels=TASK_LABELS[t.id]?TASK_LABELS[t.id].slice():[]; });
}

    let cells='';
    for(let i=0;i<startCol;i++)cells+=`<button class="oth" tabindex="-1">${fa(prevLen-startCol+1+i)}</button>`;

      cells+=`<button class="${isSel?'sel':''} ${isT?'today':''} ${dow===6?'hol':''}" data-d="${d}">${fa(d)}</button>`;
