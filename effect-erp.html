/* ---------- charts (RTL-aware SVG) ---------- */
function chLine(data,{h=150,max,fmt,color='var(--pr)',fill=true,id=uid('ch')}={}){
  const W=560,H=h,p=14;const n=data.length;
  const mx=max||Math.max(...data)*1.15;const mn=0;
  const X=i=>W-p-(i/(n-1))*(W-2*p);
  const Y=v=>H-p-((v-mn)/(mx-mn))*(H-2*p);
  const pts=data.map((v,i)=>[X(i),Y(v)]);
  const line=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
  const area=line+` L ${(W-p).toFixed(1)} ${H-p} L ${p} ${H-p} Z`;
  let grid='';for(let g=1;g<=3;g++){const gy=p+(g/4)*(H-2*p);grid+=`<line x1="${p}" x2="${W-p}" y1="${gy}" y2="${gy}" stroke="var(--bd)" stroke-dasharray="3 5" stroke-width="1"/>`;}
  const dots=pts.map((pt,i)=>i===n-1?`<circle cx="${pt[0]}" cy="${pt[1]}" r="4" fill="${color}" stroke="var(--s1)" stroke-width="2"/>`:`<circle cx="${pt[0]}" cy="${pt[1]}" r="2.5" fill="${color}"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" role="img">${grid}
    ${fill?`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#${id})"/>`:''}
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}
function chBars(data,{h=150,color='var(--pr)',color2='var(--bd2)',fmt}={}){
  const W=560,H=h,p=14;const n=data.length;
  const mx=Math.max(...data.map(d=>Math.max(d.v,d.v2||0)))*1.15;
  const bw=(W-2*p)/n;const gw=Math.min(10,bw*.22);
  let out='';
  data.forEach((d,i)=>{
    const x=W-p-(i+1)*bw+gw/2;
    const w=bw-gw;
    if(d.v2!=null){const h2=(d.v2/mx)*(H-2*p);const h1=(d.v/mx)*(H-2*p);
      out+=`<g class="cbar-g"><rect x="${x}" y="${H-p-h2}" width="${w}" height="${h2}" rx="3" fill="${color2}" fill-opacity=".28"/>
            <rect x="${x}" y="${H-p-h1}" width="${w}" height="${h1}" rx="3" fill="${color}" fill-opacity=".42"/></g>`;}
    else{const h1=(d.v/mx)*(H-2*p);
      out+=`<g class="cbar-g"><rect x="${x}" y="${H-p-h1}" width="${w}" height="${Math.max(2,h1)}" rx="3" fill="${color}" fill-opacity="${d.dim?.3:.35}"/></g>`;}
  });
  return `<svg class="ch-bars" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" role="img">${out}</svg>`;
}
function chDonut(items,{size=128,sw=13,center}={}){
  const r=(size-sw)/2,c=2*Math.PI*r;const tot=items.reduce((s,i)=>s+i.v,0)||1;
  let off=c*0.25;// شروع از بالا
  let segs='';
  items.forEach(it=>{const len=(it.v/tot)*c;
    segs+=`<circle r="${r}" cx="${size/2}" cy="${size/2}" fill="none" stroke="${it.c}" stroke-width="${sw}" stroke-dasharray="${len-2.5} ${c-len+2.5}" stroke-dashoffset="${off}" stroke-linecap="round"/>`;
    off-=len;});
  return `<div style="position:relative;width:${size}px;height:${size}px;flex:none">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:scaleX(-1)">${segs}</svg>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <b style="font-size:19px;font-weight:600">${center?center.v:''}</b><span class="t-cap">${center?center.l:''}</span></div></div>`;
}
function spark(data,{w=90,h=30,color='var(--pr)'}={}){
  const mx=Math.max(...data),mn=Math.min(...data);
  const pts=data.map((v,i)=>[(i/(data.length-1))*w,h-3-((v-mn)/((mx-mn)||1))*(h-6)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round"/></svg>`;
}
function ringPct(pct,{size=64,sw=6,color='var(--pr)',label}={}){
  const r=(size-sw)/2,c=2*Math.PI*r;
  return `<div style="position:relative;width:${size}px;height:${size}px;flex:none">
   <svg width="${size}" height="${size}" style="transform:scaleX(-1)">
    <circle r="${r}" cx="${size/2}" cy="${size/2}" fill="none" stroke="var(--s4)" stroke-width="${sw}"/>
    <circle r="${r}" cx="${size/2}" cy="${size/2}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${(c*pct/100).toFixed(1)} ${c.toFixed(1)}" stroke-dashoffset="${(c*0.25).toFixed(1)}"/></svg>
   <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:${size/4}px">${label||fa(pct)+'٪'}</div></div>`;

function togglePalette(open){
  S.searchOpen=open===undefined?!S.searchOpen:open;
  const ex=$('#cmdp');if(ex)ex.remove();
  if(!S.searchOpen)return;
  buildCmd();cmdSel=0;
  const w=document.createElement('div');w.id='cmdp';w.className='cmdp';
  w.innerHTML=`<div class="ovl" style="position:absolute;inset:0" onclick="togglePalette(false)"></div>
   <div class="box" role="dialog" aria-label="جستجوی سراسری">
    <div class="cmd-in">${ic('search',18)}<input id="cmd-q" placeholder="جستجو یا اجرای دستور… مثلاً: فاکتور تاج محل" autocomplete="off"><kbd>Esc</kbd></div>
    <div class="cmd-list" id="cmd-list"></div>
    <div class="cmd-f"><span>میزان حرکت با کلیدهای بالا و پایین</span><span>Enter انتخاب</span><span>Esc بستن</span><span class="mr-auto">${ic('command',11)} جستجوی هوشمند</span></div></div>`;
  document.body.appendChild(w);
  const inp=w.querySelector('#cmd-q');
  inp.addEventListener('input',()=>cmdFilter(inp.value));
  inp.addEventListener('keydown',e=>{
    const items=getCmdItems();
    if(e.key==='ArrowDown'){e.preventDefault();cmdSel=Math.min(cmdSel+1,items.length-1);cmdPaint();}
    if(e.key==='ArrowUp'){e.preventDefault();cmdSel=Math.max(cmdSel-1,0);cmdPaint();}
    if(e.key==='Enter'&&items[cmdSel]){togglePalette(false);const f=items[cmdSel].fn;new Function('return ('+f+')')();}
  });
  inp.focus();cmdFilter('');
}
function getCmdItems(){return Array.from(document.querySelectorAll('.cmd-i')).map(el=>CMD[+el.dataset.i]);}
function cmdFilter(q){
  cmdSel=0;const norm=s=>String(s).replace(/ي/g,'ی').replace(/ك/g,'ک');
  q=norm(q.trim());
  const hits=CMD.map((c,i)=>({c,i})).filter(x=>!q||norm(x.c.t).includes(q)||norm(x.c.g).includes(q)).slice(0,24);
  const list=$('#cmd-list');
  if(!hits.length){list.innerHTML=`<div class="state" style="padding:32px"><div class="ic">${ic('search',22)}</div><h4>نتیجه‌ای یافت نشد</h4><p>عبارت دیگری را امتحان کنید یا از دستورات سریع استفاده کنید.</p></div>`;return;}
  let html='',lastG=null,idx=0;
  hits.forEach(h=>{
    if(h.c.g!==lastG){html+=`<div class="cmd-g">${h.c.g}</div>`;lastG=h.c.g;}
    html+=`<button class="cmd-i" data-i="${h.i}" data-idx="${idx}" onclick="togglePalette(false);const f=CMD[${h.i}].fn;new Function('return ('+f+')')()">${ic(h.c.ic,16)}<span>${hl(h.c.t,q)}</span><span class="sub">${h.c.sub||''}</span></button>`;
    idx++;
  });
  list.innerHTML=html;cmdPaint();
}
function hl(t,q){if(!q)return esc(t);const i=t.indexOf(q);if(i<0)return esc(t);return esc(t.slice(0,i))+'<span class="cmd-hl">'+esc(t.slice(i,i+q.length))+'</span>'+esc(t.slice(i+q.length));}
function cmdPaint(){const items=$$('.cmd-i');items.forEach((el,i)=>el.classList.toggle('sel',i===cmdSel));const sel=items[cmdSel];if(sel)sel.scrollIntoView({block:'nearest'});}

/* ---------- router & render ---------- */
const VIEWS={};
function parseRoute(){let h=location.hash.replace(/^#\/?/,'').trim();if(!h)h='dashboard';return h;}
function render(){
  applyTheme();
  const app=$('#app');
  if(!S.authed){app.innerHTML=authView();return;}
  const route=parseRoute();
  const scrollY=window.scrollY;
  const v=VIEWS[route]||VIEWS[route.split('/')[0]]||VIEWS['dashboard'];
  const html=routeAllowed(route)?v.vw():`<div class="pg" style="padding-top:64px">${emptyState('دسترسی به این بخش ندارید','برای دریافت دسترسی با مدیر سیستم خود تماس بگیرید.',`<button class="btn btn-pr btn-sm" onclick="go('#/dashboard')">بازگشت به داشبورد</button>`,'lock')}</div>`;
  app.innerHTML=shellHtml(html,route);
  window.scrollTo(0,S._keepScroll?scrollY:0);S._keepScroll=false;
  if(v.after)v.after(route);
}
function onRoute(){S._goto=true;render();}
window.addEventListener('hashchange',onRoute);
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();const typing=tag==='input'||tag==='textarea'||tag==='select';
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(S.authed)togglePalette(true);}
  else if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='b'&&S.authed&&!typing){e.preventDefault();toggleSb();}
  else if(e.key==='Escape'){escClose(e);}
  else if(S.authed&&!typing&&!$('#ovl')&&!S.searchOpen){
    if(e.key==='t'||e.key==='T'){taskModal(null);}
    if(e.key==='n'||e.key==='N'){openNotifDrawer();}
  }
});

function authView(){return loginStep();}
function authShell(inner,foot){
  return `<div class="auth-bg">
   <div class="auth-art" aria-hidden="true"><img src="${LOGIN_ART}" alt=""></div>
   <div class="auth-side"><div class="auth-card">
    ${inner}
    <div class="row g6 mt16" style="justify-content:center">${ic('shield',12)}<span class="t-cap">ورود محلی نسخه نمایشی · بدون اتصال به حساب واقعی</span></div>
    ${foot||''}
  </div></div></div>`;
}
function loginStep(){
  return authShell(`
   <div class="auth-brand">${logo('lg')}
     <div><h1 class="t-h2">به Effect ERP خوش آمدید</h1>
       <p class="t-bs mt4" style="text-align:center">برای مشاهده نمونه محصول وارد شوید.</p></div></div>
   <div class="auth-demo-note" role="note">${ic('alert',14)}
     <span><b>نسخه نمایشی:</b> نام کاربری <code>demo.admin</code> و رمز عبور <code>DemoOnly-123!</code> فقط داده نمونه‌اند.</span>
   </div>
   <div class="fld"><label class="lbl" for="auth-username">نام کاربری</label>
     <input class="inp" id="auth-username" autocomplete="username" autocapitalize="none" spellcheck="false"
       value="${esc(AUTH.username)}" placeholder="demo.admin" oninput="authInput('username',this.value)" onkeydown="if(event.key==='Enter')$('#auth-password').focus()">
   </div>
   <div class="fld mt12"><label class="lbl" for="auth-password">رمز عبور</label>
     <input class="inp" id="auth-password" type="password" autocomplete="current-password"
       placeholder="رمز عبور" oninput="authInput('password',this.value)" onkeydown="if(event.key==='Enter')authSubmit()">
     ${AUTH.err?`<span class="ferr" role="alert">${ic('alert',12)}${esc(AUTH.err)}</span>`:`<span class="hint">این فرم فقط شبیه‌ساز نسخه آفلاین است.</span>`}
   </div>
   <button class="btn btn-pr btn-lg btn-blk mt16" id="btn-auth" onclick="authSubmit()">
     <span class="grow">ورود به نسخه نمایشی</span>${ic('arrowleft',16)}</button>`,
   `<button class="btn btn-ghost btn-blk mt12" onclick="authDemo()">پر کردن و ورود سریع دمو</button>
    <p class="t-cap tc mt12">نسخه ۲.۶ · Effect Studio — سیستم عامل کسب‌وکار</p>`);
}
function authInput(field,value){
  if(field==='username')AUTH.username=String(value);
  if(field==='password')AUTH.password=String(value);
  AUTH.err='';
}
function authSubmit(){
  if(AUTH.username!==DEMO_AUTH.username||AUTH.password!==DEMO_AUTH.password){
    S.authed=false;
    AUTH.password='';
    AUTH.err='نام کاربری یا رمز عبور نمایشی نادرست است.';
    render();
    const input=$('#auth-password');if(input)input.focus();
    return;
  }
  AUTH.username='';AUTH.password='';AUTH.err='';
  S.authed=true;location.hash='#/dashboard';render();
  toast('ok','ورود دمو انجام شد','با کاربر نمونه مدیر سیستم وارد شدید');
}
function authDemo(){
  AUTH.username=DEMO_AUTH.username;
  AUTH.password=DEMO_AUTH.password;
  authSubmit();
}
function authReset(){AUTH.username='';AUTH.password='';AUTH.err='';}

function scopedTasks(){
  const sc=S.taskScope;
  if(sc==='my')return TASKS.filter(t=>t.assignees.includes('e1'));
  if(sc==='ws'){const ws=WS.find(w=>w.id===S.ws)||WS[0];const pids=PRJ.filter(p=>p.ws===ws.id).map(p=>p.id);return TASKS.filter(t=>t.project&&pids.includes(t.project));}
  if(sc==='cp')return TASKS.filter(t=>t.project&&cproByPrj(t.project));
  return TASKS.slice();
}
function filteredTasks(assignMe){
  const f=S.taskFilters;
  const base=assignMe?TASKS:scopedTasks();
  return base.filter(t=>{
    if(assignMe&&!t.assignees.includes('e1'))return false;
    if(f.proj&&t.project!==f.proj)return false;
    if(f.asgn&&!t.assignees.includes(f.asgn))return false;
    if(f.prio&&t.prio!==f.prio)return false;
    if(f.st&&t.status!==f.st)return false;
    if(f.q&&!t.title.includes(f.q))return false;
    return true;});
}

  return `<div class="t-h4 mb8">${jDowFa(toJ(ds))} ${dFaL(ds)}</div>
  ${evs.length?evs.map(e=>`<div class="row g10" style="padding:8px 0;border-bottom:1px solid var(--bd)">
    <span class="ev ${e.cls}" style="padding:4px 8px">${esc(e.t)}</span></div>`).join(''):`<div class="empty-mini">رویدادی در این روز نیست</div>`}
  <button class="btn btn-sec btn-sm btn-blk mt8" onclick="meetModal('${ds}')">${ic('plus',13)} افزودن رویداد</button>`;
}
function calWeek(){
  const start=jAdd(TODAY,-((jDow(TODAY)+1)%7));
  return `<div style="display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--bd)">
  ${[...Array(7)].map((_,i)=>{const d=jAdd(start,i);const ds=d.jy+'/'+pad2(d.jm)+'/'+pad2(d.jd);
    const evs=calEventsFor(ds);
    return `<div style="border-left:1px solid var(--bd);min-height:280px;padding:8px">
     <div class="tc mb8"><div class="t-cap">${FA_WD_S[i]}</div><b style="font-size:16px;${ds==='1405/06/05'?'color:var(--pr3)':''}">${fa(d.jd)}</b></div>
     ${evs.map(e=>`<div class="ev ${e.cls}" style="margin-bottom:4px;padding:4px 8px" onclick="${e.fn==='—'?'':e.fn}"><span>${esc(e.t)}</span></div>`).join('')}</div>`;}).join('')}</div>`;
}
function calDayView(){
  const ds=S.calSel||'1405/06/05';const evs=calEventsFor(ds);

   <h3 class="t-h3 mb12">${jDowFa(toJ(ds))} ${dFaL(ds)}</h3>

function calList(){
  const all=[];
  MEETS.forEach(m=>all.push({d:m.date,t:m.t,cls:'meet',l:'جلسه — '+m.who.map(w=>emp(w).name.split(' ')[0]).join('، '),fn:`meetInfo('${m.id}')`}));
  TASKS.filter(t=>t.due&&t.status!=='done').forEach(t=>all.push({d:t.due,t:'سررسید: '+t.title,cls:'task',l:'تسک — '+emp(t.assignee).name,fn:`taskDrawer('${t.id}')`}));
  all.sort((a,b)=>a.d<b.d?-1:1);
  return `<div style="padding:8px 16px 16px">${all.slice(0,12).map(e=>`
   <div class="row g12" style="padding:12px 0;border-bottom:1px solid var(--bd);cursor:pointer" onclick="${e.fn}">
     <span style="width:110px" class="t-cap num">${dFa(e.d)}</span>
     <span class="ev ${e.cls}" style="padding:4px 12px">${esc(e.t)}</span>
     <span class="t-cap mr-auto ellip">${esc(e.l)}</span></div>`).join('')}</div>`;
}

function leadDrop(e,stage){
  e.preventDefault();$$('.kb-col').forEach(c=>c.classList.remove('dragover'));
  const id=e.dataTransfer.getData('text/plain');const l=LEADS.find(x=>x.id===id);if(!l||l.stage===stage)return;
  const old=l.stage;l.stage=stage;render();
  if(stage==='won'){toast('ok','برنده شدید!','قرارداد '+l.co+' — '+faCompact(l.value)+' تومان');}
  else toast('ok','سرنخ منتقل شد',l.co+' ← '+PIPE.find(s=>s.id===stage).t,{t:'واگرد',fn:`LEADS.find(x=>x.id==='${id}').stage='${old}';render()`});
}

  const co=$('#ld-co').value.trim();if(!co){$('#ld-co').classList.add('err');return;}

function cpCalCells(cp){
  const cells=[];const don=cpFwTotal(cp,'done');
  const days=cpDonDays(cp);
  for(let i=1;i<=31;i++)cells.push({d:i,n:days[i]||0,today:i===28});
  const off=5; /* شروع ماه: جمعه */
  for(let i=0;i<off;i++)cells.unshift({d:0,n:0});
  return cells;
}
function cpDonDays(cp){
  /* توزیع واقع‌نمایانه انتشارها روی روزهای ماه */
  const map={};let pool=[];
  CP_TYPES.forEach(([k])=>{for(let i=0;i<(cp.done[k]||0);i++)pool.push(k);});
  (cp.done.custom||[]).forEach(x=>{for(let i=0;i<x.n;i++)pool.push('x');});
  const step=Math.max(1,Math.floor(31/Math.max(pool.length,1)));
  pool.forEach((k,i)=>{const d=Math.min(31,1+i*step);map[d]=(map[d]||0)+1;});
  return map;
}

function mpTotals(list){
  const n=list.length||1;
  const T={reach:list.reduce((a,p)=>a+p.reach,0),imp:list.reduce((a,p)=>a+p.imp,0),
    likes:list.reduce((a,p)=>a+p.likes,0),cm:list.reduce((a,p)=>a+p.cm,0),
    sv:list.reduce((a,p)=>a+p.sv,0),sh:list.reduce((a,p)=>a+p.sh,0),
    eng:list.reduce((a,p)=>a+p.likes+p.cm+p.sv+p.sh,0),
    avgReach:Math.round(list.reduce((a,p)=>a+p.reach,0)/n),
    avgEng:Math.round(list.reduce((a,p)=>a+p.likes+p.cm+p.sv+p.sh,0)/n),
    er:list.reduce((a,p)=>a+mpER(p),0)/n};
  T.maxReach=Math.max(...list.map(p=>p.reach),1);
  T.best=[...list].sort((a,b)=>mpER(b)-mpER(a))[0]||null;
  T.worst=[...list].sort((a,b)=>mpER(a)-mpER(b))[0]||null;
  T.types=MP_TYPES.map(([k,t])=>{const ps=list.filter(p=>p.type===k);if(!ps.length)return null;
    return {t,n:ps.length,reach:ps.reduce((a,p)=>a+p.reach,0),avgReach:Math.round(ps.reduce((a,p)=>a+p.reach,0)/ps.length),
      er:ps.reduce((a,p)=>a+mpER(p),0)/ps.length};}).filter(Boolean);
  T.maxAvgReach=Math.max(...T.types.map(x=>x.avgReach),1);
  T.maxEr=Math.max(...T.types.map(x=>x.er),.1);
  return T;
}

function usrCreate(){
  const n=$('#nu-n').value.trim();
  if(!n){$('#nu-n').classList.add('err');return;}
  const ph=$('#nu-ph').value.trim()||'۰۹۱۲۰۰۰۰۰۰۰';
  const rid=$('#nu-role').value;
  const e={id:uid('e'),name:n,role:ROLES.find(r=>r.id===rid).t,dept:$('#nu-dep').value,
    email:$('#nu-em').value.trim()||'new@effectstudio.ir',phone:ph,start:'1405/06/28',status:'in',
    skills:[],load:0,score:0};
  EMP.unshift(e);
  USER_ACC[e.id]={st:$('#nu-st').value,last:'—'};
  permAuditAdd(n,'حساب پنل','ایجاد شد (نقش: '+e.role+')');
  closeModal();render();
  toast('ok','کاربر با موفقیت ایجاد شد','«'+n+'» با نقش '+e.role+' ایجاد شد؛ اکنون دسترسی‌ها را پیکربندی کنید.');
  setTimeout(()=>permDrawer(e.id),500);
}

function usrSave(id){
  const e=emp(id);

function usrToggle(id){
  const e=emp(id);const acc=USER_ACC[id];
  const deactivating=acc.st==='فعال';
  const doIt=()=>{
    acc.st=deactivating?'غیرفعال':'فعال';
    permAuditAdd(e.name,'وضعیت حساب',deactivating?'غیرفعال شد':'فعال شد');
    render();toast(deactivating?'warn':'ok',deactivating?'کاربر غیرفعال شد':'کاربر فعال شد',e.name+(deactivating?' — داده‌های تاریخی حفظ می‌شود':''));
  };
  if(deactivating)confirmDlg('غیرفعال‌سازی کاربر','«'+e.name+'» دیگر به پنل دسترسی نخواهد داشت؛ داده‌های تاریخی او حفظ می‌شود.',doIt,'غیرفعال‌سازی',true);
  else doIt();
}

function permDrawer(id){
  const e=emp(id);
  if(isSuperAdmin(id)){
    openDrawer({title:'دسترسی‌ها — '+e.name,sub:'Super Admin',icon:'shield',body:`
     <div class="panel" style="padding:16px;display:flex;align-items:center;gap:12px">
      ${ic('shield',24)}<div class="grow min0"><b class="t-bs">دسترسی کامل مدیر سیستم</b>
      <p class="t-cap">دسترسی‌های Super Admin از طریق رابط کاربری قابل حذف نیست؛ فقط مدیر سیستم دیگر می‌تواند آن را مدیریت کند.</p></div></div>`,
    footer:`<button class="btn btn-ghost mr-auto" onclick="closeDrawer()">بستن</button>`});
    return;
  }
  const rid=empRid(e);
  const ov=USER_OVERRIDES[id]||{};
  const acts=['v','c','e','d','ok','m','x'];
  openDrawer({title:'مدیریت دسترسی — '+e.name,sub:'نقش: '+e.role,icon:'key',body:`
   <div class="panel mb12" style="padding:12px"><span class="t-cap">دسترسی نهایی = پیش‌فرض نقش + دسترسی‌های اختصاصی این کاربر. نشان «اختصاصی» یعنی تفاوت با نقش.</span></div>
   <div class="perm-mx">
    <div class="perm-hd"><span>قابلیت</span>${acts.map(a=>`<span>${ACT_FA[a]}</span>`).join('')}</div>
    ${MODS.map(m=>`
     <div class="perm-row" data-mod="${m.id}">
      <span class="pm-t">${m.t}${ov[m.id]&&Object.keys(ov[m.id]).length?`<span class="badge bd-pr">اختصاصی</span>`:`<span class="t-cap">از نقش</span>`}</span>
      ${acts.map(a=>{
        const applicable=m.acts.includes(a);
        const on=can(m.id,a,id,rid);
        return `<span>${applicable?`<button type="button" class="ptgl ${on?'on':''}" data-mod="${m.id}" data-act="${a}" data-uid="${id}" onclick="permTgl(this)">${ic('check',11)}</button>`:''}</span>`;}).join('')}
     </div>`).join('')}
   </div>
   <p class="t-cap mt12">${ic('lock',12)} تغییرات بلافاصله در ناوبری و عملیات این کاربر اعمال می‌شود و در لاگ حسابرسی ثبت می‌گردد.</p>`,
  footer:`<button class="btn btn-pr" onclick="permReset('${id}')">بازنشانی به نقش</button>
   <button class="btn btn-ghost mr-auto" onclick="closeDrawer();render()">بستن</button>`});
}
function permTgl(btn){
  const {mod,act,uid}=btn.dataset;
  USER_OVERRIDES[uid]=USER_OVERRIDES[uid]||{};
  const o=USER_OVERRIDES[uid];
  const rid=empRid(emp(uid));
  const roleVal=can(mod,act,null,rid);
  o[mod]=o[mod]||{};
  const cur=o[mod][act]!==undefined?o[mod][act]:roleVal;
  o[mod][act]=cur?0:1;
  if(o[mod][act]==(roleVal?1:0))delete o[mod][act];
  if(Object.keys(o[mod]).length===0)delete o[mod];
  if(Object.keys(o).length===0)delete USER_OVERRIDES[uid];
  btn.classList.toggle('on');
  const row=btn.closest('.perm-row');
  const badge=row.querySelector('.pm-t .badge, .pm-t .t-cap');
  const hasOv=(USER_OVERRIDES[uid]||{})[mod];
  if(badge)badge.outerHTML=hasOv?'<span class="badge bd-pr">اختصاصی</span>':'<span class="t-cap">از نقش</span>';
  permAuditAdd(emp(uid).name,'دسترسی «'+(MODS.find(m=>m.id===mod)||{}).t+'» ('+ACT_FA[act]+')',(o[mod]&&o[mod][act])||(!hasOv&&roleVal)?'فعال شد':'غیرفعال شد');
}
function permReset(id){
  delete USER_OVERRIDES[id];
  permAuditAdd(emp(id).name,'دسترسی‌ها','بازنشانی به پیش‌فرض نقش');
  closeDrawer();render();
  toast('ok','دسترسی‌ها بازنشانی شد','برای '+emp(id).name+' فقط دسترسی‌های نقش باقی ماند.');
}
